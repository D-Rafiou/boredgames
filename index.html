        const d = Math.sqrt(dx * dx + dy * dy) || 0.001, nx = dx / d, ny = dy / d;
        b.x = p.x + nx * rs; b.y = p.y + ny * rs;                 // push out of the peg
        const vn = b.vx * nx + b.vy * ny;
        if (vn < 0) {
          b.vx -= (1 + E) * vn * nx; b.vy -= (1 + E) * vn * ny;   // bounce
          b.vx += rand(-18, 18);                                  // a touch of chaos so no ball balances on a peg
          if (-vn > 120) api.sound.play('peg');
        }
      }
      if (b.y + b.r > SLOT_TOP) {                                 // inside the slot area: the dividers are walls
        const slot = clamp(Math.floor(b.x / SLOT_W), 0, SLOTS - 1);
        const lo = slot * SLOT_W + b.r, hi = (slot + 1) * SLOT_W - b.r;
        if (b.x < lo) { b.x = lo; b.vx = Math.abs(b.vx) * E; }
        if (b.x > hi) { b.x = hi; b.vx = -Math.abs(b.vx) * E; }
      }
    }

    function land(b) {
      b.done = true;
      const slot = clamp(Math.floor(b.x / SLOT_W), 0, SLOTS - 1), v = VALUES[slot];
      api.addScore(v);
      api.sound.play(v >= 100 ? 'win' : v >= 30 ? 'gold' : 'pop');
      particles.burst(b.x, H - 30, SLOT_COLORS[slot], v >= 30 ? 22 : 8, 200);
      popups.push({ text: `+${v}`, x: slot * SLOT_W + SLOT_W / 2, y: SLOT_TOP - 10, t: 1, color: SLOT_COLORS[slot] });
    }

    const game = {
      reset() {
        balls = []; left = TOTAL; aiming = false; aim = W / 2; lastDrop = 0; popups = []; finishT = 0;
        particles.clear();
        api.setInfo(`Balls left ${left}`);
      },

      update(dt) {
        particles.update(dt);
        popups.forEach(p => { p.t -= dt; p.y -= 40 * dt; }); popups = popups.filter(p => p.t > 0);
        const steps = 4, h = dt / steps;
        for (const b of balls) {
          if (b.done) { b.fade = Math.max(0, b.fade - dt * 2); continue; }
          for (let i = 0; i < steps; i++) stepBall(b, h);
          b.slow = Math.hypot(b.vx, b.vy) < 25 ? b.slow + dt : 0;
          if (b.slow > 1.2) { b.vx += rand(-160, 160); b.vy -= 120; b.slow = 0; }   // un-stick a ball that's balancing
          if (b.y > H - 30) land(b);
        }
        balls = balls.filter(b => b.fade > 0);
        if (left === 0 && balls.every(b => b.done)) { finishT += dt; if (finishT > 0.8) api.end('All balls dropped'); }
        else finishT = 0;
      },

      idle(dt) { particles.update(dt); },

      pointerdown(p) { aiming = true; aim = p.x; },
      pointermove(p) { if (aiming || api.input.ptr.inside) aim = p.x; },
      pointerup(p) { if (aiming) { aiming = false; drop(p.x); } },

      draw(ctx) {
        // slots
        for (let i = 0; i < SLOTS; i++) {
          ctx.fillStyle = SLOT_COLORS[i]; ctx.globalAlpha = 0.22;
          ctx.fillRect(i * SLOT_W, SLOT_TOP, SLOT_W, H - SLOT_TOP); ctx.globalAlpha = 1;
          label(ctx, VALUES[i], i * SLOT_W + SLOT_W / 2, H - 22, VALUES[i] >= 100 ? 22 : 20, SLOT_COLORS[i]);
        }
        ctx.fillStyle = 'rgba(255,255,255,.55)';
        for (let i = 1; i < SLOTS; i++) ctx.fillRect(i * SLOT_W - 2, SLOT_TOP, 4, H - SLOT_TOP);
        // pegs
        ctx.fillStyle = '#c9bdf2';
        for (const p of pegs) { ctx.beginPath(); ctx.arc(p.x, p.y, PEG_R, 0, Math.PI * 2); ctx.fill(); }
        // aim guide
        if (left > 0 && (aiming || api.input.ptr.inside)) {
          const r = radius(TOTAL - left), ax = clamp(aim, r, W - r);
          ctx.globalAlpha = 0.4; ctx.fillStyle = '#ffd93d';
          ctx.beginPath(); ctx.arc(ax, 46, r, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#ffd93d'; ctx.lineWidth = 2; ctx.setLineDash([4, 8]);
          ctx.beginPath(); ctx.moveTo(ax, 60); ctx.lineTo(ax, 120); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
        } else if (left > 0 && balls.length === 0) label(ctx, 'Tap to drop', W / 2, 46, 24, '#fff', 'center', 0.6);
        // balls
        for (const b of balls) {
          ctx.globalAlpha = b.fade; ctx.fillStyle = '#ffd93d'; ctx.shadowColor = '#ffd93d'; ctx.shadowBlur = 10;
          ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
          ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(b.x - b.r * .3, b.y - b.r * .3, b.r * .3, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = 1;
        }
        particles.draw(ctx);
        popups.forEach(p => label(ctx, p.text, p.x, p.y, 26, p.color, 'center', clamp(p.t * 1.5, 0, 1)));
      },
    };
    return game;
  },
});


/* --------------------------------------------------------------------------
   Whack-a-Mole
   30 seconds. Moles pop up faster and stay up for less time as the clock runs
   down. Golden moles are worth 30. Chain hits for a streak bonus; a miss or an
   escaped mole breaks it.
   -------------------------------------------------------------------------- */
registerGame({
  id: 'whack-a-mole',
  group: 'quick',
  name: 'Whack-a-Mole',
  emoji: '🔨',
  color: '#e0a458',
  blurb: 'Thirty seconds. Whack everything that pops up.',
  help: 'Tap or click the moles. On a keyboard, the nine keys Q W E / A S D / Z X C match the nine holes. Golden moles are worth 30.',
  size: [480, 560],

  create(api) {
    const { W } = api;
    const TIME = 30;
    const COLS = [100, 240, 380], ROWS = [210, 350, 490];
    const KEYS = ['q', 'w', 'e', 'a', 's', 'd', 'z', 'x', 'c'];
    const holes = [];
    for (let j = 0; j < 3; j++) for (let i = 0; i < 3; i++) holes.push({ x: COLS[i], y: ROWS[j], up: false, t: 0, dur: 1, golden: false, hit: false, hitT: 0 });
    const particles = makeParticles();
    let elapsed, spawnT, streak, texts, swing;

    const popTime = () => Math.max(0.5, 1.25 - elapsed * 0.025);
    const spawnGap = () => Math.max(0.32, 0.95 - elapsed * 0.02);
    const maxUp = () => Math.min(3, 1 + Math.floor(elapsed / 10));

    function spawn() {
      const free = holes.filter(h => !h.up && h.hitT <= 0);
      if (!free.length || holes.filter(h => h.up && !h.hit).length >= maxUp()) return;
      const h = pick(free), golden = Math.random() < 0.12;
      Object.assign(h, { up: true, t: 0, golden, hit: false, hitT: 0, dur: golden ? popTime() * 0.75 : popTime() });
    }

    function whack(i) {
      const h = holes[i];
      if (h.up && !h.hit) {
        h.hit = true; h.hitT = 0.35;
        const pts = (h.golden ? 30 : 10) + Math.min(streak, 10);
        streak++;
        api.addScore(pts);
        api.sound.play(h.golden ? 'gold' : 'whack');
        particles.burst(h.x, h.y - 30, h.golden ? '#ffd93d' : '#e0a458', 14, 220);
        texts.push({ text: `+${pts}`, x: h.x, y: h.y - 70, t: 0.7 });
      } else { streak = 0; api.sound.play('buzz'); }
      swing = { x: holes[i].x, y: holes[i].y, t: 0.18 };
    }

    function holeAt(p) {
      let bestI = -1, bestD = 70 * 70;
      holes.forEach((h, i) => { const d = (p.x - h.x) ** 2 + (p.y - (h.y - 25)) ** 2; if (d < bestD) { bestD = d; bestI = i; } });
      return bestI;
    }

    const game = {
      reset() {
        elapsed = 0; spawnT = 0.6; streak = 0; texts = []; swing = null;
        holes.forEach(h => Object.assign(h, { up: false, t: 0, hit: false, hitT: 0, golden: false }));
        particles.clear();
        api.setInfo(`Time ${TIME}`);
      },

      update(dt) {
        elapsed += dt;
        particles.update(dt);
        texts.forEach(t => { t.t -= dt; t.y -= 40 * dt; }); texts = texts.filter(t => t.t > 0);
        if (swing) { swing.t -= dt; if (swing.t <= 0) swing = null; }
        spawnT -= dt;
        if (spawnT <= 0) { spawn(); spawnT = spawnGap() * rand(0.7, 1.3); }
        for (const h of holes) {
          if (h.hitT > 0) { h.hitT -= dt; if (h.hitT <= 0) h.up = false; continue; }
          if (!h.up) continue;
          h.t += dt;
          if (h.t >= h.dur) { h.up = false; streak = 0; }             // it got away
        }
        api.setInfo(`Time ${Math.max(0, Math.ceil(TIME - elapsed))}`);
        if (elapsed >= TIME) { api.sound.play('go'); api.end('Time’s up!'); }
      },

      idle(dt) { particles.update(dt); },
      keydown(e, k) { const i = KEYS.indexOf(k); if (i >= 0) whack(i); },
      pointerdown(p) { const i = holeAt(p); if (i >= 0) whack(i); else { streak = 0; } },

      draw(ctx) {
        // timer bar
        const f = clamp(1 - elapsed / TIME, 0, 1);
        ctx.fillStyle = 'rgba(255,255,255,.1)'; rr(ctx, 30, 40, W - 60, 16, 8); ctx.fill();
        ctx.fillStyle = f > 0.25 ? '#e0a458' : '#ff4f6d'; rr(ctx, 30, 40, Math.max(16, (W - 60) * f), 16, 8); ctx.fill();
        if (streak >= 2) label(ctx, `Streak ${streak}`, W / 2, 90, 26, '#ffd93d');

        for (const h of holes) {
          // the dark inside of the hole, then the mole (clipped at the hole's centre line), then the hole's front lip on top
          ctx.fillStyle = '#1a0e07'; ctx.beginPath(); ctx.ellipse(h.x, h.y + 6, 56, 20, 0, 0, Math.PI * 2); ctx.fill();
          ctx.save();
          ctx.beginPath(); ctx.rect(h.x - 70, h.y - 130, 140, 136); ctx.clip();       // only show the part above the hole
          if (h.up || h.hitT > 0) {
            const rise = h.hit ? 1 - (0.35 - h.hitT) / 0.35 * 0.4 : clamp(Math.min(h.t / 0.12, (h.dur - h.t) / 0.12), 0, 1);
            const my = h.y + 62 - rise * 78 + (h.hit ? 14 : 0);
            ctx.fillStyle = h.golden ? '#ffd93d' : '#a8703a';
            ctx.beginPath(); ctx.ellipse(h.x, my, 42, 48, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = h.golden ? '#fff1a6' : '#d9a066';
            ctx.beginPath(); ctx.ellipse(h.x, my + 14, 24, 17, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#2b1a10'; ctx.beginPath(); ctx.ellipse(h.x, my + 6, 7, 5, 0, 0, Math.PI * 2); ctx.fill();   // nose
            ctx.fillStyle = '#fff';
            if (h.hit) { label(ctx, '×', h.x - 15, my - 10, 22, '#2b1a10'); label(ctx, '×', h.x + 15, my - 10, 22, '#2b1a10'); }
            else {
              ctx.beginPath(); ctx.arc(h.x - 15, my - 10, 8, 0, Math.PI * 2); ctx.arc(h.x + 15, my - 10, 8, 0, Math.PI * 2); ctx.fill();
              ctx.fillStyle = '#2b1a10'; ctx.beginPath(); ctx.arc(h.x - 14, my - 9, 4, 0, Math.PI * 2); ctx.arc(h.x + 16, my - 9, 4, 0, Math.PI * 2); ctx.fill();
            }
          }
          ctx.restore();
          // the hole's front lip
          ctx.fillStyle = '#4a2d19'; ctx.beginPath(); ctx.ellipse(h.x, h.y + 6, 56, 20, 0, 0, Math.PI); ctx.fill();
          ctx.strokeStyle = '#8a5a30'; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(h.x, h.y + 6, 56, 20, 0, 0, Math.PI * 2); ctx.stroke();
        }
        // keyboard hints on each hole
        holes.forEach((h, i) => label(ctx, KEYS[i].toUpperCase(), h.x, h.y + 40, 14, 'rgba(255,255,255,.35)'));
        particles.draw(ctx);
        texts.forEach(t => label(ctx, t.text, t.x, t.y, 26, '#ffd93d', 'center', clamp(t.t * 2, 0, 1)));
        if (swing) { ctx.save(); ctx.translate(swing.x + 30, swing.y - 90); ctx.rotate(0.5 - swing.t * 4); label(ctx, '🔨', 0, 0, 50, '#fff', 'center', clamp(swing.t * 6, 0, 1)); ctx.restore(); }
      },
    };
    return game;
  },
});


/* --------------------------------------------------------------------------
   Memory Match
   Cards are shown face up for a moment, then flip down. Find all the pairs
   before the clock runs out. Each level has more cards and a shorter preview.
   -------------------------------------------------------------------------- */
registerGame({
  id: 'memory-match',
  group: 'quick',
  name: 'Memory Match',
  emoji: '🧠',
  color: '#4aa8ff',
  blurb: 'Find every pair before time runs out.',
  help: 'Tap two cards to flip them. Matching back-to-back builds a streak bonus. Clear a board to move up a level: more cards, less peeking. On a keyboard, use the arrow keys and Space.',
  size: [480, 560],

  create(api) {
    const { W, H } = api;
    const LEVELS = [[4, 3], [4, 4], [5, 4], [6, 4], [6, 5], [6, 6]];          // [columns, rows]
    const EMOJI = ['🍎', '🍌', '🍇', '🍓', '🍉', '🍒', '🥝', '🍍', '🥑', '🌽', '🍕', '🍔', '🍩', '🍪', '🎈', '⚽', '🚀', '🐙', '🦊', '🐸', '🐼', '🌈', '⭐', '🔥'];
    const particles = makeParticles();
    let cards, cols, level, timeLeft, timeMax, open, resolve, streak, peekT, banner, cursor, usedKey;

    const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

    function build() {
      const [c, rows] = LEVELS[Math.min(level - 1, LEVELS.length - 1)];
      cols = c;
      const pairs = c * rows / 2;
      const faces = shuffle(EMOJI).slice(0, pairs);
      const values = shuffle([...faces, ...faces]);
      const gap = 10, areaW = W - 40, areaH = H - 120;
      const s = Math.min((areaW - gap * (c - 1)) / c, (areaH - gap * (rows - 1)) / rows);
      const x0 = (W - (c * s + (c - 1) * gap)) / 2, y0 = 90 + (areaH - (rows * s + (rows - 1) * gap)) / 2;
      cards = values.map((v, i) => ({ v, s, x: x0 + (i % c) * (s + gap), y: y0 + Math.floor(i / c) * (s + gap), flip: 1, face: true, matched: false, glow: 0 }));
      peekT = Math.max(0.7, 2.4 - 0.35 * (level - 1));                         // a short look at the board first
      timeMax = timeLeft = 25 + pairs * Math.max(2.8, 5 - 0.3 * (level - 1));
      open = []; resolve = null; cursor = 0;
    }

    function updateInfo() { api.setInfo(`Level ${level}   Time ${Math.max(0, Math.ceil(timeLeft))}`); }

    function flipCard(i) {
      if (peekT > 0 || resolve || banner) return;
      const c = cards[i];
      if (!c || c.face || c.matched) return;
      c.face = true; open.push(i);
      api.sound.play('flip');
      if (open.length === 2) resolve = { ok: cards[open[0]].v === cards[open[1]].v, t: cards[open[0]].v === cards[open[1]].v ? 0.45 : 0.75 };
    }

    function finishResolve() {
      const [a, b] = open;
      if (resolve.ok) {
        cards[a].matched = cards[b].matched = true; cards[a].glow = cards[b].glow = 1;
        const pts = 100 + Math.min(streak, 5) * 20;
        streak++;
        api.addScore(pts);
        api.sound.play('match');
        for (const i of [a, b]) particles.burst(cards[i].x + cards[i].s / 2, cards[i].y + cards[i].s / 2, '#4aa8ff', 10, 180);
        if (cards.every(c => c.matched)) {
          const bonus = Math.ceil(timeLeft) * 5 + level * 50;
          api.addScore(bonus);
          api.sound.play('levelup');
          banner = { text: `Level ${level} clear!  +${bonus}`, t: 1.5 };
        }
      } else {
        cards[a].face = cards[b].face = false; streak = 0;
        api.sound.play('buzz');
      }
      open = []; resolve = null;
    }

    const game = {
      reset() { level = 1; streak = 0; banner = null; usedKey = false; particles.clear(); build(); updateInfo(); },

      update(dt) {
        for (const c of cards) {
          const target = c.face || c.matched ? 1 : 0;
          c.flip += clamp(target - c.flip, -dt * 7, dt * 7);
          if (c.glow > 0) c.glow = Math.max(0, c.glow - dt * 1.5);
        }
        particles.update(dt);
        if (banner) { banner.t -= dt; if (banner.t <= 0) { banner = null; level++; build(); updateInfo(); } return; }
        if (peekT > 0) { peekT -= dt; if (peekT <= 0) cards.forEach(c => { c.face = false; }); return; }
        if (resolve) { resolve.t -= dt; if (resolve.t <= 0) finishResolve(); }
        timeLeft -= dt; updateInfo();
        if (timeLeft <= 0) { api.sound.play('lose'); api.end('Time’s up!'); }
      },

      idle(dt) { particles.update(dt); },

      pointerdown(p) {
        const i = cards.findIndex(c => p.x >= c.x && p.x <= c.x + c.s && p.y >= c.y && p.y <= c.y + c.s);
        if (i >= 0) { usedKey = false; flipCard(i); }
      },
      keydown(e, k) {
        const n = cards.length;
        if (k === 'arrowright') cursor = (cursor + 1) % n;
        else if (k === 'arrowleft') cursor = (cursor + n - 1) % n;
        else if (k === 'arrowdown') cursor = (cursor + cols) % n;
        else if (k === 'arrowup') cursor = (cursor + n - cols) % n;
        else if (k === ' ' || k === 'enter') flipCard(cursor);
        else return;
        usedKey = true;
      },

      draw(ctx) {
        // timer bar
        const f = clamp(timeLeft / timeMax, 0, 1);
        ctx.fillStyle = 'rgba(255,255,255,.1)'; rr(ctx, 30, 36, W - 60, 14, 7); ctx.fill();
        ctx.fillStyle = f > 0.25 ? '#4aa8ff' : '#ff4f6d'; rr(ctx, 30, 36, Math.max(14, (W - 60) * f), 14, 7); ctx.fill();
        if (peekT > 0) label(ctx, 'Memorize!', W / 2, 72, 26, '#ffd93d');
        else if (streak >= 2) label(ctx, `Streak ${streak}`, W / 2, 72, 24, '#ffd93d');

        cards.forEach((c, i) => {
          const sx = Math.abs(Math.cos(c.flip * Math.PI)), cx = c.x + c.s / 2, cy = c.y + c.s / 2;
          ctx.save();
          ctx.translate(cx, cy); ctx.scale(Math.max(0.02, sx), 1);
          if (c.flip > 0.5) {                                          // face
            ctx.fillStyle = c.matched ? '#d8f0ff' : '#f6f1ff';
            rr(ctx, -c.s / 2, -c.s / 2, c.s, c.s, c.s * 0.16); ctx.fill();
            if (c.glow > 0) { ctx.strokeStyle = `rgba(74,168,255,${c.glow})`; ctx.lineWidth = 5; ctx.stroke(); }
            ctx.font = `${Math.floor(c.s * 0.55)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#150d2b';
            ctx.fillText(c.v, 0, 3);
          } else {                                                     // back
            ctx.fillStyle = '#3a4fc9'; rr(ctx, -c.s / 2, -c.s / 2, c.s, c.s, c.s * 0.16); ctx.fill();
            ctx.fillStyle = '#5b78ff'; rr(ctx, -c.s / 2 + 6, -c.s / 2 + 6, c.s - 12, c.s - 12, c.s * 0.12); ctx.fill();
            label(ctx, '?', 0, 2, c.s * 0.5, 'rgba(255,255,255,.55)');
          }
          ctx.restore();
          if (usedKey && i === cursor) { ctx.strokeStyle = '#ffd93d'; ctx.lineWidth = 4; rr(ctx, c.x - 4, c.y - 4, c.s + 8, c.s + 8, c.s * 0.2); ctx.stroke(); }
        });
        particles.draw(ctx);
        if (banner) {
          ctx.fillStyle = 'rgba(14,8,32,.7)'; ctx.fillRect(0, H / 2 - 50, W, 100);
          label(ctx, banner.text, W / 2, H / 2, 36, '#ffd93d');
        }
      },
    };
    return game;
  },
});


/* --------------------------------------------------------------------------
   Reaction Time Test
   Five rounds. Wait for the screen to turn green, then tap as fast as you can.
   Tap too early and it's a false start (three and you're out). From round 4 the
   screen will sometimes try to trick you with a yellow fake-out. Your score is
   the average in milliseconds, so a LOWER number is better.
   -------------------------------------------------------------------------- */
registerGame({
  id: 'reaction-time',
  group: 'quick',
  name: 'Reaction Time',
  emoji: '⚡',
  color: '#2fd16b',
  scoring: { lower: true, unit: ' ms' },
  blurb: 'Tap the instant it turns green. Lower is better.',
  help: 'Wait for green, then tap, click, or press Space. Don’t go early! Five rounds, and your score is your average in milliseconds. After round 3, watch out for the yellow fake-out.',
  size: [480, 560],

  create(api) {
    const { W, H } = api;
    const ROUNDS = 5;
    const COLORS = { wait: '#d9304f', fake: '#e8b923', go: '#2fd16b', result: '#3b4bd6', soon: '#7a2a8f' };
    let st, round, times, waited, waitT, fakeAt, fakeDone, fakeT, goAt, msg, resultT, falseStarts;

    const avg = () => times.length ? Math.round(times.reduce((a, b) => a + b, 0) / times.length) : 0;
    const rating = a => a < 220 ? 'Lightning fast!' : a < 280 ? 'Quick!' : a < 380 ? 'Not bad' : 'Wake up!';

    function startRound() {
      st = 'wait'; waited = 0; fakeDone = false;
      const fake = round >= 3 && Math.random() < 0.7;
      waitT = rand(1.4, 3.4) + (fake ? 1.3 : 0);
      fakeAt = fake ? rand(0.6, 1.2) : -1;
      api.setInfo(`Round ${round + 1} of ${ROUNDS}`);
    }

    function tap() {
      if (st === 'wait' || st === 'fake') {                                  // too early!
        falseStarts++;
        api.sound.play('buzz');
        st = 'soon'; resultT = 1.3;
        msg = falseStarts >= 3 ? 'Too jumpy!' : `Too soon! (${falseStarts} of 3)`;
      } else if (st === 'go') {
        const ms = Math.round(performance.now() - goAt);
        times.push(ms); round++;
        api.setScore(avg());
        api.sound.play(ms < 250 ? 'gold' : 'pop');
        st = 'result'; resultT = 1.25; msg = `${ms} ms`;
      }
    }

    const game = {
      reset() { round = 0; times = []; falseStarts = 0; msg = ''; startRound(); st = 'wait'; waited = -0.6; },   // a short beat before round 1

      update(dt) {
        if (st === 'wait') {
          waited += dt;
          if (fakeAt >= 0 && !fakeDone && waited >= fakeAt) { st = 'fake'; fakeT = 0.55; }
          else if (waited >= waitT) { st = 'go'; goAt = performance.now(); api.sound.play('go'); }
        } else if (st === 'fake') {
          waited += dt; fakeT -= dt;
          if (fakeT <= 0) { st = 'wait'; fakeDone = true; }
        } else if (st === 'result' || st === 'soon') {
          resultT -= dt;
          if (resultT <= 0) {
            if (falseStarts >= 3) { api.end('Too jumpy!'); return; }
            if (round >= ROUNDS) { api.end(rating(avg())); return; }
            startRound();
          }
        }
      },

      pointerdown() { tap(); },
      keydown(e, k) { if (k === ' ' || k === 'enter') tap(); },

      draw(ctx) {
        ctx.fillStyle = COLORS[st]; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(0, 0, W, H);
        const big = { wait: 'Wait for green…', fake: 'Almost…', go: 'TAP!', result: msg, soon: msg }[st];
        label(ctx, big, W / 2, H / 2 - 20, st === 'go' ? 110 : st === 'result' ? 84 : 44, '#fff');
        const sub = { wait: waited < 0 ? 'Get ready' : 'Don’t tap yet', fake: 'Not yet…', go: '', result: rating(times[times.length - 1] || 999), soon: round >= 0 ? 'The round starts again' : '' }[st];
        if (sub) label(ctx, sub, W / 2, H / 2 + 50, 24, 'rgba(255,255,255,.8)');
        // round pips + the times so far
        for (let i = 0; i < ROUNDS; i++) {
          ctx.beginPath(); ctx.arc(W / 2 + (i - 2) * 34, 56, 11, 0, Math.PI * 2);
          ctx.fillStyle = i < times.length ? '#fff' : 'rgba(255,255,255,.25)'; ctx.fill();
        }
        times.forEach((t, i) => label(ctx, `${i + 1}.  ${t} ms`, W / 2, H - 150 + i * 26, 20, 'rgba(255,255,255,.85)'));
      },
    };
    return game;
  },
});


/* --------------------------------------------------------------------------
   Flappy
   Tap to flap, slip through the gaps. The pipes speed up and the gaps shrink
   as your score climbs.
   -------------------------------------------------------------------------- */
registerGame({
  id: 'flappy',
  group: 'quick',
  name: 'Flappy',
  emoji: '🐤',
  color: '#7bdff2',
  blurb: 'Tap to flap through the gaps.',
  help: 'Tap, click, or press Space (or ↑) to flap. Don’t touch the pipes or the ground.',
  size: [480, 640],

  create(api) {
    const { W, H } = api;
    const R = 14, BX = 120, PW = 72, GROUND = H - 56, GRAVITY = 1500, FLAP = -470, SPACING = 235;
    const bird = { y: H / 2, vy: 0 };
    const particles = makeParticles();
    let pipes, started, scroll, bob;

    const speed = () => Math.min(270, 150 + 3.5 * api.score);
    const gapSize = () => Math.max(135, 205 - 3 * api.score);

    function addPipe(x) {
      const gap = gapSize(), last = pipes[pipes.length - 1];
      let lo = 90 + gap / 2, hi = GROUND - 90 - gap / 2;
      if (last) { lo = Math.max(lo, last.gapY - 170); hi = Math.min(hi, last.gapY + 170); }   // never an impossible jump
      pipes.push({ x, gapY: rand(lo, hi), gap, passed: false });
    }

    function flap() {
      started = true;
      bird.vy = FLAP;
      api.sound.play('flap');
      particles.burst(BX - 8, bird.y + 6, '#ffffff', 3, 60);
    }

    function crash() { api.sound.play('lose'); particles.burst(BX, bird.y, '#ffd93d', 18, 240); api.end('Crashed!'); }

    function hitsRect(rx, ry, rw, rh) {
      const cx = clamp(BX, rx, rx + rw), cy = clamp(bird.y, ry, ry + rh);
      return (BX - cx) ** 2 + (bird.y - cy) ** 2 < (R - 1) ** 2;
    }

    const game = {
      reset() {
        pipes = []; started = false; scroll = 0; bob = 0; bird.y = H / 2; bird.vy = 0; particles.clear();
        addPipe(W + 120); addPipe(W + 120 + SPACING);
      },

      update(dt) {
        scroll += (started ? speed() : 60) * dt;
        particles.update(dt);
        if (!started) { bob += dt; bird.y = H / 2 + Math.sin(bob * 4) * 8; return; }
        bird.vy = Math.min(800, bird.vy + GRAVITY * dt);
        bird.y += bird.vy * dt;
        if (bird.y < R) { bird.y = R; bird.vy = 0; }
        for (const p of pipes) {
          p.x -= speed() * dt;
          if (!p.passed && p.x + PW < BX - R) { p.passed = true; api.addScore(1); api.sound.play('pop'); }
        }
        if (pipes[0].x + PW < -10) pipes.shift();
        if (pipes[pipes.length - 1].x < W - SPACING + 60) addPipe(pipes[pipes.length - 1].x + SPACING);
        if (bird.y + R > GROUND) return crash();
        for (const p of pipes) {
          if (hitsRect(p.x, 0, PW, p.gapY - p.gap / 2) || hitsRect(p.x, p.gapY + p.gap / 2, PW, H)) return crash();
        }
      },

      idle(dt) { particles.update(dt); },
      pointerdown() { flap(); },
      keydown(e, k) { if (k === ' ' || k === 'arrowup' || k === 'w') flap(); },

      draw(ctx) {
        // distant stars drifting past
        for (let i = 0; i < 16; i++) {
          const x = ((i * 97 - scroll * 0.15) % (W + 20) + W + 20) % (W + 20) - 10, y = (i * 61) % (GROUND - 40) + 10;
          ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(x, y, 3, 3);
        }
        // pipes
        for (const p of pipes) {
          for (const [y, h, capY] of [[0, p.gapY - p.gap / 2, p.gapY - p.gap / 2 - 24], [p.gapY + p.gap / 2, GROUND, p.gapY + p.gap / 2]]) {
            ctx.fillStyle = '#34c46a'; ctx.fillRect(p.x, y, PW, h - (y === 0 ? 0 : y));
            ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(p.x + 8, y, 10, h - (y === 0 ? 0 : y));
            ctx.fillStyle = '#26a057'; rr(ctx, p.x - 6, capY, PW + 12, 24, 6); ctx.fill();
          }
        }
        // ground
        ctx.fillStyle = '#3a2a66'; ctx.fillRect(0, GROUND, W, H - GROUND);
        ctx.fillStyle = '#5b44a6'; for (let x = -((scroll % 40)); x < W; x += 40) ctx.fillRect(x, GROUND, 20, 8);
        // bird (tilts with its speed)
        ctx.save(); ctx.translate(BX, bird.y); ctx.rotate(clamp(bird.vy / 900, -0.5, 0.9));
        ctx.fillStyle = '#ffd93d'; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffb02e'; ctx.beginPath(); ctx.ellipse(-4, 4, 8, 5, 0.3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ff8a3d'; ctx.beginPath(); ctx.moveTo(R - 2, -2); ctx.lineTo(R + 9, 2); ctx.lineTo(R - 2, 6); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(5, -5, 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#150d2b'; ctx.beginPath(); ctx.arc(7, -5, 2.4, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        particles.draw(ctx);
        label(ctx, api.score, W / 2, 70, 64, 'rgba(255,255,255,.85)');
        if (!started) label(ctx, 'Tap to flap', W / 2, H / 2 + 80, 30, '#fff', 'center', 0.5 + 0.5 * Math.sin(performance.now() / 300));
      },
    };
    return game;
  },
});


/* --------------------------------------------------------------------------
   Dodge
   Slide left and right to stay alive. Things fall faster and more often the
   longer you last. Squeaking past a rock earns a bonus. Score = time survived
   (10 points a second) plus bonuses.
   -------------------------------------------------------------------------- */
registerGame({
  id: 'dodge',
  group: 'quick',
  name: 'Dodge',
  emoji: '☄️',
  color: '#ff4f6d',
  blurb: 'Stay alive while the sky falls.',
  help: 'Move with the mouse, your finger (drag anywhere), or ← → (A D). Near misses earn a bonus.',
  size: [480, 640],

  create(api) {
    const { W, H } = api;
    const PY = H - 70, PR = 15;
    const player = { x: W / 2 };
    const particles = makeParticles();
    let objs, elapsed, spawnT, bonus, texts, trail;

    const fallSpeed = () => Math.min(560, 190 + elapsed * 7);
    const interval = () => Math.max(0.17, 0.75 - elapsed * 0.012);
    const setX = x => { player.x = clamp(x, PR, W - PR); };

    function spawn() {
      const r = rand(10, 24);
      const drift = elapsed > 10 ? rand(-1, 1) * Math.min(150, (elapsed - 10) * 4) : 0;     // diagonal rocks arrive later
      objs.push({ x: rand(r, W - r), y: -r, r, vy: fallSpeed() * rand(0.85, 1.2), vx: drift, spin: rand(0, 6), close: false });
    }

    const game = {
      reset() {
        objs = []; elapsed = 0; spawnT = 0.5; bonus = 0; texts = []; trail = [];
        setX(api.input.ptr.inside ? api.input.ptr.x : W / 2); particles.clear();
        api.setInfo('');
      },

      update(dt) {
        elapsed += dt;
        const k = api.input.keys, d = (k.has('arrowright') || k.has('d') ? 1 : 0) - (k.has('arrowleft') || k.has('a') ? 1 : 0);
        if (d) setX(player.x + d * 580 * dt);
        particles.update(dt);
        texts.forEach(t => { t.t -= dt; t.y -= 40 * dt; }); texts = texts.filter(t => t.t > 0);
        trail.push({ x: player.x, t: 0.25 }); trail.forEach(t => t.t -= dt); trail = trail.filter(t => t.t > 0);

        spawnT -= dt;
        if (spawnT <= 0) { spawn(); spawnT = interval() * rand(0.6, 1.3); }
        for (const o of objs) {
          o.x += o.vx * dt; o.y += o.vy * dt; o.spin += dt * 3;
          const dist = Math.hypot(o.x - player.x, o.y - PY);
          if (dist < PR + o.r * 0.88) {
            api.sound.play('lose'); particles.burst(player.x, PY, '#ff4f6d', 26, 300);
            api.end('Squashed!'); return;
          }
          if (!o.close && o.y > PY && dist < PR + o.r + 10) {                      // it just missed you
            o.close = true; bonus += 5; api.sound.play('tick');
            texts.push({ text: 'Close! +5', x: player.x, y: PY - 36, t: 0.7 });
          }
        }
        objs = objs.filter(o => o.y < H + 40 && o.x > -60 && o.x < W + 60);
        api.setScore(Math.floor(elapsed * 10) + bonus);
        api.setInfo(`Time ${elapsed.toFixed(1)}s`);
      },

      idle(dt) { particles.update(dt); },
      pointerdown(p) { setX(p.x); },
      pointermove(p) { setX(p.x); },

      draw(ctx) {
        // speed lines
        ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 2;
        for (let i = 0; i < 12; i++) { const x = (i * 83 + 20) % W, y = ((performance.now() / 4 * (0.6 + i % 3 * 0.3) + i * 90) % H); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 26); ctx.stroke(); }
        // rocks
        for (const o of objs) {
          ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.spin);
          ctx.fillStyle = '#8a5a44'; ctx.beginPath();
          for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2, rr2 = o.r * (i % 2 ? 0.86 : 1.04); ctx.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2); }
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.arc(-o.r * 0.3, -o.r * 0.3, o.r * 0.28, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
          // fiery tail: a tapered flame trailing up and behind the rock
          const tx = o.x - o.vx * 0.12, ty = o.y - o.vy * 0.12 - o.r;
          const g = ctx.createLinearGradient(o.x, o.y - o.r, tx, ty);
          g.addColorStop(0, 'rgba(255,170,60,.55)'); g.addColorStop(1, 'rgba(255,79,109,0)');
          ctx.fillStyle = g; ctx.beginPath();
          ctx.moveTo(o.x - o.r * 0.7, o.y - o.r * 0.6); ctx.lineTo(tx, ty); ctx.lineTo(o.x + o.r * 0.7, o.y - o.r * 0.6); ctx.closePath(); ctx.fill();
        }
        // player
        trail.forEach(t => { ctx.globalAlpha = t.t * 1.2; ctx.fillStyle = '#ff4f6d'; ctx.beginPath(); ctx.arc(t.x, PY + 6, PR * 0.7, 0, Math.PI * 2); ctx.fill(); });
        ctx.globalAlpha = 1;
        ctx.shadowColor = '#ff4f6d'; ctx.shadowBlur = 16; ctx.fillStyle = '#ff7a93';
        ctx.beginPath(); ctx.arc(player.x, PY, PR, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(player.x - 5, PY - 3, 3.5, 0, Math.PI * 2); ctx.arc(player.x + 5, PY - 3, 3.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#150d2b'; ctx.beginPath(); ctx.arc(player.x - 5, PY - 2, 1.6, 0, Math.PI * 2); ctx.arc(player.x + 5, PY - 2, 1.6, 0, Math.PI * 2); ctx.fill();
        particles.draw(ctx);
        texts.forEach(t => label(ctx, t.text, t.x, t.y, 22, '#ffd93d', 'center', clamp(t.t * 2, 0, 1)));
      },
    };
    return game;
  },
});


/* --------------------------------------------------------------------------
   Simon Says
   Watch the pads light up, then repeat the pattern. Every round adds one step
   and the playback gets faster. Score = longest pattern you got right.
   -------------------------------------------------------------------------- */
registerGame({
  id: 'simon-says',
  group: 'quick',
  name: 'Simon Says',
  emoji: '🎵',
  color: '#ffd93d',
  blurb: 'Watch the pattern, then repeat it.',
  help: 'Tap the pads in the same order they lit up. On a keyboard use Q W / A S (or 1 2 3 4), laid out like the pads.',
  size: [480, 540],

  create(api) {
    const { W } = api;
    const PADS = [
      { x: 32,  y: 70,  col: '#2fd16b', key: 'q' },
      { x: 248, y: 70,  col: '#ff4f6d', key: 'w' },
      { x: 32,  y: 286, col: '#ffd93d', key: 'a' },
      { x: 248, y: 286, col: '#4aa8ff', key: 's' },
    ];
    const SIZE = 200;
    let seq, st, idx, showI, phase, t, lit, msg;

    const lightTime = () => Math.max(0.22, 0.52 - 0.02 * seq.length);     // playback speeds up
    const gapTime = () => Math.max(0.12, 0.26 - 0.01 * seq.length);

    function nextRound() {
      seq.push(randInt(0, 3));
      st = 'show'; showI = 0; phase = 'gap'; t = 0.7; idx = 0; lit = null;
      msg = 'Watch…';
      api.setInfo(`Pattern length ${seq.length}`);
    }

    function light(i, dur) { lit = { i, t: dur }; api.sound.play('simon', i); }

    function press(i) {
      if (st !== 'input') return;
      light(i, 0.25);
      if (i !== seq[idx]) {
        st = 'fail'; msg = 'Wrong pad!'; api.sound.play('buzz');
        setTimeout(() => api.end(`You got ${seq.length - 1} right`), 350);
        return;
      }
      idx++;
      if (idx === seq.length) {
        api.setScore(seq.length);
        st = 'between'; t = 0.9; msg = 'Nice!';
        api.sound.play('match');
      }
    }

    const game = {
      reset() { seq = []; lit = null; nextRound(); },

      update(dt) {
        if (lit) { lit.t -= dt; if (lit.t <= 0) lit = null; }
        if (st === 'show') {
          t -= dt;
          if (t > 0) return;
          if (phase === 'gap') {
            if (showI >= seq.length) { st = 'input'; msg = 'Your turn'; return; }
            light(seq[showI], lightTime()); phase = 'lit'; t = lightTime();
          } else {
            phase = 'gap'; showI++; t = gapTime();
          }
        } else if (st === 'between') {
          t -= dt; if (t <= 0) nextRound();
        }
      },

      pointerdown(p) {
        const i = PADS.findIndex(d => p.x >= d.x && p.x <= d.x + SIZE && p.y >= d.y && p.y <= d.y + SIZE);
        if (i >= 0) press(i);
      },
      keydown(e, k) {
        const i = PADS.findIndex((d, n) => d.key === k || k === String(n + 1));
        if (i >= 0) press(i);
      },

      draw(ctx) {
        PADS.forEach((d, i) => {
          const on = lit && lit.i === i;
          ctx.save();
          if (on) { ctx.shadowColor = d.col; ctx.shadowBlur = 36; }
          ctx.globalAlpha = on ? 1 : 0.38;
          ctx.fillStyle = d.col; rr(ctx, d.x, d.y, SIZE, SIZE, 34); ctx.fill();
          ctx.restore();
          ctx.globalAlpha = 1;
          if (on) { ctx.fillStyle = 'rgba(255,255,255,.35)'; rr(ctx, d.x + 10, d.y + 10, SIZE - 20, 50, 26); ctx.fill(); }
          label(ctx, d.key.toUpperCase(), d.x + SIZE - 26, d.y + SIZE - 24, 20, 'rgba(255,255,255,.45)');
        });
        // centre disc with the status
        ctx.fillStyle = '#120b26'; ctx.beginPath(); ctx.arc(W / 2, 286 - 8, 62, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 4; ctx.stroke();
        label(ctx, String(seq.length), W / 2, 270, 46, '#fff');
        label(ctx, 'steps', W / 2, 304, 15, 'rgba(255,255,255,.6)');
        label(ctx, msg, W / 2, 40, 28, '#fff');
      },
    };
    return game;
  },
});


/* --------------------------------------------------------------------------
   Helpers shared by the 2-player games
   -------------------------------------------------------------------------- */

/** Like label(), but can be drawn upside down for the player sitting across the table. */
function labelFlip(ctx, text, x, y, size, color, flip, alpha = 1) {
  ctx.save();
  ctx.translate(x, y);
  if (flip) ctx.rotate(Math.PI);
  label(ctx, text, 0, 0, size, color, 'center', alpha);
  ctx.restore();
}

const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';


/* --------------------------------------------------------------------------
   Tug of War  (2 players)
   Tap, tap, tap! Every tap drags the flag a little toward you, and it slowly
   creeps back to the middle if you stop tapping while you're ahead. Drag it all the way to your side to
   win the round. First to 2 rounds wins.
   -------------------------------------------------------------------------- */
registerGame({
  id: 'tug-of-war',
  group: 'two',
  name: 'Tug of War',
  emoji: '🪢',
  color: '#ffa13d',
  players: 2,
  p1Color: '#ffd93d',
  p2Color: '#2ee6d6',
  blurb: 'Tap faster than your friend to drag the flag to your side.',
  help: 'Best of 3 rounds. Player 1 (bottom): tap your half of the screen, or press A, S or D. Player 2 (top): tap your half, or press J, K or L. Wait for GO, then mash!',
  size: [480, 640],

  create(api) {
    const { W, H } = api;
    const WIN_ROUNDS = 2, PULL = 0.065, DRIFT = 0.3, IDLE = 400;
    const COL = ['#ffd93d', '#2ee6d6'];
    const KEYS = [['a', 's', 'd'], ['j', 'k', 'l']];
    const TOP = 120, BOT = H - 120;                         // where the flag stops if you win
    const particles = makeParticles();
    let m, wins, phase, t, pulse, lastTap, banner, round;      // m: -1 = Player 2's end (top), +1 = Player 1's end (bottom)

    const flagY = () => H / 2 + m * (BOT - H / 2);

    function startRound() {
      m = 0; phase = 'count'; t = 2.4; pulse = [0, 0]; lastTap = [0, 0]; banner = null;
      api.setInfo(`Round ${round}`);
    }

    function tap(i) {
      if (phase !== 'pull') return;
      const now = performance.now();
      if (now - lastTap[i] < 30) return;                      // ignore a rolling key / double event
      lastTap[i] = now;
      m = clamp(m + (i === 0 ? 1 : -1) * PULL, -1, 1);
      pulse[i] = 1;
      api.sound.play('tap');
    }

    function roundWon(i) {
      wins[i]++; api.setScores(wins[0], wins[1]);
      particles.burst(W / 2, flagY(), COL[i], 30, 320);
      api.sound.play('goal');
      if (wins[i] >= WIN_ROUNDS) { phase = 'over'; api.endMatch(i + 1, `${wins[0]} rounds to ${wins[1]}`); return; }
      phase = 'done'; t = 1.5; banner = `Player ${i + 1} takes the round!`; round++;
    }

    const game = {
      reset() { wins = [0, 0]; round = 1; particles.clear(); api.setScores(0, 0); startRound(); },

      update(dt) {
        particles.update(dt);
        pulse[0] = Math.max(0, pulse[0] - dt * 8); pulse[1] = Math.max(0, pulse[1] - dt * 8);
        if (phase === 'count') {
          const before = Math.ceil(t); t -= dt;
          if (Math.ceil(t) !== before && t > 0) api.sound.play('beep');
          if (t <= 0) { phase = 'pull'; api.sound.play('go'); }
        } else if (phase === 'pull') {
          // If the player who is winning stops tapping, the rope creeps back toward the middle.
          // (While both keep mashing it doesn't, so being a little faster really does win.)
          const lead = m > 0 ? 0 : m < 0 ? 1 : -1;
          if (lead >= 0 && performance.now() - lastTap[lead] > IDLE) m -= Math.sign(m) * Math.min(Math.abs(m), DRIFT * dt);
          if (m >= 1) roundWon(0); else if (m <= -1) roundWon(1);
        } else if (phase === 'done') {
          t -= dt; if (t <= 0) startRound();
        }
      },
      idle(dt) { particles.update(dt); },

      pointerdown(p) { tap(p.y > H / 2 ? 0 : 1); },
      keydown(e, k) { KEYS.forEach((set, i) => { if (set.includes(k)) tap(i); }); },

      draw(ctx) {
        // each player's half, tinted with their colour
        ctx.fillStyle = 'rgba(46,230,214,.07)'; ctx.fillRect(0, 0, W, H / 2);
        ctx.fillStyle = 'rgba(255,217,61,.07)'; ctx.fillRect(0, H / 2, W, H / 2);
        // finish lines
        for (const [y, c] of [[TOP, COL[1]], [BOT, COL[0]]]) { ctx.fillStyle = c; ctx.globalAlpha = 0.5; ctx.fillRect(0, y - 2, W, 4); ctx.globalAlpha = 1; }
        // the rope
        ctx.strokeStyle = '#c9a26b'; ctx.lineWidth = 12; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(W / 2, 50); ctx.lineTo(W / 2, H - 50); ctx.stroke();
        ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 3; ctx.setLineDash([6, 10]);
        ctx.beginPath(); ctx.moveTo(W / 2, 50); ctx.lineTo(W / 2, H - 50); ctx.stroke(); ctx.setLineDash([]);
        // centre mark
        ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(W / 2 - 40, H / 2 - 2, 80, 4);
        // the flag
        const fy = flagY();
        ctx.shadowColor = '#ffa13d'; ctx.shadowBlur = 18; ctx.fillStyle = '#ff5d5d';
        ctx.beginPath(); ctx.moveTo(W / 2, fy - 22); ctx.lineTo(W / 2 + 46, fy); ctx.lineTo(W / 2, fy + 22); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.shadowBlur = 0; ctx.beginPath(); ctx.arc(W / 2, fy, 9, 0, Math.PI * 2); ctx.fill();
        // the players: bigger when they've just tapped
        [[0, H - 54], [1, 54]].forEach(([i, y]) => {
          const r = 34 + pulse[i] * 8;
          ctx.fillStyle = COL[i]; ctx.beginPath(); ctx.arc(W / 2, y, r, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#150d2b';
          const dir = i === 0 ? -1 : 1;
          ctx.beginPath(); ctx.arc(W / 2 - 11, y + dir * 6, 4.5, 0, Math.PI * 2); ctx.arc(W / 2 + 11, y + dir * 6, 4.5, 0, Math.PI * 2); ctx.fill();
        });
        // tap-zone hints, upside down for Player 2
        if (phase === 'pull' || phase === 'count') {
          labelFlip(ctx, api.isTouch() ? 'TAP!' : 'TAP!   A S D', W / 2 + 130, H - 150, 28, COL[0], false, 0.55);
          labelFlip(ctx, api.isTouch() ? 'TAP!' : 'TAP!   J K L', W / 2 - 130, 150, 28, COL[1], true, 0.55);
        }
        particles.draw(ctx);
        if (phase === 'count') label(ctx, t > 0.6 ? String(Math.ceil(t - 0.6)) : 'GO!', W / 2, H / 2 - 60, 90, '#fff');
        if (phase === 'done') label(ctx, banner, W / 2, H / 2 - 70, 30, '#ffd93d');
      },
    };
    return game;
  },
});


/* --------------------------------------------------------------------------
   Light Cycles  (2 players)
   Two bikes leave glowing trails. Don't hit a wall, a trail, or each other:
   the last bike running wins the round. Steering is relative: "left" always
   turns left from the bike's point of view. First to 3 rounds wins.
   -------------------------------------------------------------------------- */
registerGame({
  id: 'light-cycles',
  group: 'two',
  name: 'Light Cycles',
  emoji: '🏍️',
  color: '#ff4fa3',
  players: 2,
  blurb: 'Trap your friend behind your glowing trail.',
  help: 'First to 3 rounds. Turn left or right from your bike’s point of view. Player 1 (pink, bottom): A and D, or the bottom buttons. Player 2 (cyan, top): ← and →, or the top buttons.',
  size: [480, 640],

  create(api) {
    const { W, H } = api;
    const COLS = 30, ROWS = 30, CS = 14, BX = 30, BY = 110, WIN_ROUNDS = 3;
    const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];               // 0 up, 1 right, 2 down, 3 left
    const COL = ['#ff4fa3', '#2ee6d6'];
    const pad = makeTouchPad(api, [
      { id: 'p1l', x: 30,  y: 556, w: 200, h: 70, label: '◀', color: COL[0] },
      { id: 'p1r', x: 250, y: 556, w: 200, h: 70, label: '▶', color: COL[0] },
      { id: 'p2l', x: 250, y: 14,  w: 200, h: 70, label: '◀', color: COL[1], flip: true },   // upside down: left for the player across the table
      { id: 'p2r', x: 30,  y: 14,  w: 200, h: 70, label: '▶', color: COL[1], flip: true },
    ]);
    const particles = makeParticles();
    let grid, bikes, phase, t, stepT, steps, wins, banner, round;

    const idx = (x, y) => y * COLS + x;
    const turn = (d, side) => (d + (side < 0 ? 3 : 1)) % 4;

    function startRound() {
      grid = new Uint8Array(COLS * ROWS);
      bikes = [
        { x: 14, y: 27, d: 0, q: [], alive: true },             // Player 1 starts at the bottom heading up
        { x: 15, y: 2,  d: 2, q: [], alive: true },             // Player 2 starts at the top heading down
      ];
      bikes.forEach((b, i) => { grid[idx(b.x, b.y)] = i + 1; });
      phase = 'count'; t = 2.1; steps = 0; stepT = 0; banner = null; pad.reset();
      api.setInfo(`Round ${round}`);
    }

    const queueTurn = (i, side) => { const q = bikes[i].q; if (phase !== 'done' && q.length < 2) q.push(side); };

    function step() {
      bikes.forEach(b => { if (b.q.length) b.d = turn(b.d, b.q.shift()); });
      const next = bikes.map(b => ({ x: b.x + DX[b.d], y: b.y + DY[b.d] }));
      const dead = next.map(n => n.x < 0 || n.y < 0 || n.x >= COLS || n.y >= ROWS || grid[idx(n.x, n.y)] !== 0);
      if (!dead[0] && !dead[1] && next[0].x === next[1].x && next[0].y === next[1].y) dead[0] = dead[1] = true;   // head-on
      bikes.forEach((b, i) => {
        if (dead[i]) { b.alive = false; particles.burst(BX + (b.x + 0.5) * CS, BY + (b.y + 0.5) * CS, COL[i], 28, 280); return; }
        b.x = next[i].x; b.y = next[i].y; grid[idx(b.x, b.y)] = i + 1;
      });
      steps++;
      if (dead[0] || dead[1]) {
        api.sound.play('lose');
        if (dead[0] && dead[1]) { phase = 'done'; t = 1.6; banner = 'Both crashed! Replay'; return; }
        const w = dead[0] ? 1 : 0;
        wins[w]++; api.setScores(wins[0], wins[1]);
        if (wins[w] >= WIN_ROUNDS) { phase = 'over'; api.endMatch(w + 1, `${wins[0]} rounds to ${wins[1]}`); return; }
        phase = 'done'; t = 1.6; banner = `Player ${w + 1} wins the round!`; round++;
      }
    }

    const game = {
      reset() { wins = [0, 0]; round = 1; particles.clear(); api.setScores(0, 0); startRound(); },

      update(dt) {
        particles.update(dt);
        for (const [id, i, s] of [['p1l', 0, -1], ['p1r', 0, 1], ['p2l', 1, -1], ['p2r', 1, 1]]) if (pad.pressed(id)) queueTurn(i, s);
        if (phase === 'count') {
          const before = Math.ceil(t); t -= dt;
          if (Math.ceil(t) !== before && t > 0) api.sound.play('beep');
          if (t <= 0) { phase = 'run'; api.sound.play('go'); }
        } else if (phase === 'run') {
          stepT -= dt;
          while (stepT <= 0 && phase === 'run') { step(); stepT += Math.max(0.055, 0.1 - steps * 0.0005); }   // the bikes slowly get faster
        } else if (phase === 'done') {
          t -= dt; if (t <= 0) startRound();
        }
      },
      idle(dt) { particles.update(dt); },

      pointerdown(p, e) { pad.down(p, e); },
      pointermove(p, e) { pad.move(p, e); },
      pointerup(p, e) { pad.up(p, e); },
      keydown(e, k) {
        if (k === 'a') queueTurn(0, -1); else if (k === 'd') queueTurn(0, 1);
        else if (k === 'arrowleft') queueTurn(1, -1); else if (k === 'arrowright') queueTurn(1, 1);
      },

      draw(ctx) {
        // board
        ctx.fillStyle = '#0c0720'; ctx.fillRect(BX, BY, COLS * CS, ROWS * CS);
        ctx.fillStyle = 'rgba(255,255,255,.06)';
        for (let x = 0; x <= COLS; x += 1) for (let y = 0; y <= ROWS; y += 3) ctx.fillRect(BX + x * CS - 1, BY + y * CS - 1, 2, 2);
        ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3; ctx.strokeRect(BX - 1.5, BY - 1.5, COLS * CS + 3, ROWS * CS + 3);
        // trails
        for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
          const v = grid[idx(x, y)];
          if (!v) continue;
          ctx.fillStyle = COL[v - 1]; ctx.globalAlpha = 0.75;
          ctx.fillRect(BX + x * CS + 1, BY + y * CS + 1, CS - 2, CS - 2);
        }
        ctx.globalAlpha = 1;
        // heads
        bikes.forEach((b, i) => {
          if (!b.alive) return;
          ctx.shadowColor = COL[i]; ctx.shadowBlur = 16; ctx.fillStyle = '#fff';
          ctx.fillRect(BX + b.x * CS - 1, BY + b.y * CS - 1, CS + 2, CS + 2); ctx.shadowBlur = 0;
        });
        particles.draw(ctx);
        pad.draw(ctx);
        if (!api.isTouch()) {                                     // keyboard reminders where the touch buttons would be
          labelFlip(ctx, 'Player 1:  A  D', W / 2, H - 60, 22, COL[0], false, 0.8);
          labelFlip(ctx, 'Player 2:  ←  →', W / 2, 54, 22, COL[1], true, 0.8);
        }
        if (phase === 'count') label(ctx, t > 0.5 ? String(Math.ceil(t - 0.5)) : 'GO!', W / 2, BY + ROWS * CS / 2, 100, '#fff');
        if (phase === 'done') { ctx.fillStyle = 'rgba(14,8,32,.65)'; ctx.fillRect(BX, BY + 170, COLS * CS, 80); label(ctx, banner, W / 2, BY + 210, 30, '#ffd93d'); }
      },
    };
    return game;
  },
});


/* --------------------------------------------------------------------------
   Air Hockey  (2 players)
   Slide your mallet to whack the puck into the other goal. First to 7.
   Mallets can't cross the centre line. Touch: each player drags in their own half.
   -------------------------------------------------------------------------- */
registerGame({
  id: 'air-hockey',
  group: 'two',
  name: 'Air Hockey',
  emoji: '🏒',
  color: '#4aa8ff',
  players: 2,
  p1Color: '#ff6b6b',
  p2Color: '#4aa8ff',
  blurb: 'Whack the puck into your friend’s goal. First to 7.',
  help: 'Player 1 (bottom, red): drag in the bottom half, or use W A S D. Player 2 (top, blue): drag in the top half, or use the arrow keys. With a mouse, move it over your half.',
  size: [480, 720],

  create(api) {
    const { W, H } = api;
    const PR = 17, MR = 33, GOAL = 170, WIN = 7, MAXV = 1150, SUB = 4;
    const COL = ['#ff6b6b', '#4aa8ff'];
    const HOME = [{ x: W / 2, y: H - 110 }, { x: W / 2, y: 110 }];
    const mallets = [0, 1].map(i => ({ x: HOME[i].x, y: HOME[i].y, tx: HOME[i].x, ty: HOME[i].y, vx: 0, vy: 0 }));
    const owner = new Map();
    const particles = makeParticles();
    let puck, goals, pause, banner, pendingServe = 0;

    const clampMallet = (i, x, y) => ({
      x: clamp(x, MR, W - MR),
      y: i === 0 ? clamp(y, H / 2 + MR, H - MR) : clamp(y, MR, H / 2 - MR),
    });
    const aim = (i, x, y) => { const c = clampMallet(i, x, y); mallets[i].tx = c.x; mallets[i].ty = c.y; };

    function serve(toward) {                                     // the player who just conceded gets the puck on their side
      puck = { x: W / 2, y: H / 2 + (toward === 0 ? 120 : -120), vx: 0, vy: 0 };
      mallets.forEach((m, i) => { m.x = m.tx = HOME[i].x; m.y = m.ty = HOME[i].y; m.vx = m.vy = 0; });
    }

    function goal(scorer) {
      goals[scorer]++; api.setScores(goals[0], goals[1]);
      api.sound.play('goal');
      particles.burst(puck.x, scorer === 0 ? 6 : H - 6, COL[scorer], 34, 340);
      if (goals[scorer] >= WIN) { pause = 99; api.endMatch(scorer + 1, `Final score ${goals[0]} to ${goals[1]}`); puck.vx = puck.vy = 0; puck.y = H / 2; return; }
      pause = 1.1; banner = `Goal for Player ${scorer + 1}!`;
      puck.vx = puck.vy = 0; puck.y = scorer === 0 ? -100 : H + 100;     // hide it until the serve
      pendingServe = 1 - scorer;
    }

    function collideMallet(i) {
      const m = mallets[i];
      let dx = puck.x - m.x, dy = puck.y - m.y, d = Math.hypot(dx, dy);
      const minD = PR + MR;
      if (d >= minD) return;
      if (d < 0.001) { dx = 0; dy = i === 0 ? -1 : 1; d = 1; }
      const nx = dx / d, ny = dy / d;
      puck.x = m.x + nx * minD; puck.y = m.y + ny * minD;          // push the puck out of the mallet
      const rel = (puck.vx - m.vx) * nx + (puck.vy - m.vy) * ny;   // closing speed along the contact normal
      if (rel < 0) { puck.vx -= 1.9 * rel * nx; puck.vy -= 1.9 * rel * ny; }
      // never let a hit be limp: make sure the puck leaves at least a little faster than it arrived
      const sp = Math.hypot(puck.vx, puck.vy);
      if (sp < 180) { puck.vx += nx * 180; puck.vy += ny * 180; }
      if (api.sound) api.sound.play('paddle');
    }

    const game = {
      reset() {
        goals = [0, 0]; pause = 0; banner = null; owner.clear(); particles.clear();
        api.setScores(0, 0); serve(Math.random() < 0.5 ? 0 : 1);
      },

      update(dt) {
        particles.update(dt);
        // keyboard moves the target
        const k = api.input.keys, sp = 520 * dt;
        const kd = (a, b) => (k.has(b) ? 1 : 0) - (k.has(a) ? 1 : 0);
        const p1x = kd('a', 'd'), p1y = kd('w', 's'), p2x = kd('arrowleft', 'arrowright'), p2y = kd('arrowup', 'arrowdown');
        if (p1x || p1y) aim(0, mallets[0].tx + p1x * sp, mallets[0].ty + p1y * sp);
        if (p2x || p2y) aim(1, mallets[1].tx + p2x * sp, mallets[1].ty + p2y * sp);

        if (pause > 0 && pause < 90) { pause -= dt; if (pause <= 0) { serve(pendingServe); banner = null; } }
        const h = dt / SUB;
        for (let s = 0; s < SUB; s++) {
          mallets.forEach(m => {                                   // glide to the target, keeping a real velocity for the hit
            const dx = m.tx - m.x, dy = m.ty - m.y, d = Math.hypot(dx, dy), step = Math.min(d, 2400 * h);
            const nx = d > 0 ? dx / d * step : 0, ny = d > 0 ? dy / d * step : 0;
            m.x += nx; m.y += ny; m.vx = nx / h; m.vy = ny / h;
          });
          if (pause > 0) continue;
          puck.x += puck.vx * h; puck.y += puck.vy * h;
          const f = Math.exp(-0.45 * h); puck.vx *= f; puck.vy *= f;      // a little air friction
          // side walls
          if (puck.x < PR)     { puck.x = PR;     puck.vx =  Math.abs(puck.vx) * 0.94; api.sound.play('wall'); }
          if (puck.x > W - PR) { puck.x = W - PR; puck.vx = -Math.abs(puck.vx) * 0.94; api.sound.play('wall'); }
          // end walls, with a slot for each goal
          const inSlot = Math.abs(puck.x - W / 2) < GOAL / 2 - 8;
          if (!inSlot) {
            if (puck.y < PR)     { puck.y = PR;     puck.vy =  Math.abs(puck.vy) * 0.94; api.sound.play('wall'); }
            if (puck.y > H - PR) { puck.y = H - PR; puck.vy = -Math.abs(puck.vy) * 0.94; api.sound.play('wall'); }
          }
          collideMallet(0); collideMallet(1);
          const v = Math.hypot(puck.vx, puck.vy);
          if (v > MAXV) { puck.vx *= MAXV / v; puck.vy *= MAXV / v; }
          if (puck.y < -PR * 0.5) { goal(0); continue; }
          if (puck.y > H + PR * 0.5) { goal(1); continue; }
        }
      },
      idle(dt) { particles.update(dt); },

      pointerdown(p, e) { const i = p.y > H / 2 ? 0 : 1; owner.set(e.pointerId, i); aim(i, p.x, p.y); },
      pointermove(p, e) {
        if (owner.has(e.pointerId)) aim(owner.get(e.pointerId), p.x, p.y);
        else if (e.pointerType === 'mouse') aim(p.y > H / 2 ? 0 : 1, p.x, p.y);   // a mouse just hovers over the half it's in
      },
      pointerup(p, e) { owner.delete(e.pointerId); },

      draw(ctx) {
        // rink markings
        ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(W / 2, H / 2, 70, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(W / 2, 0, GOAL / 2 + 24, 0, Math.PI); ctx.stroke();
        ctx.beginPath(); ctx.arc(W / 2, H, GOAL / 2 + 24, Math.PI, Math.PI * 2); ctx.stroke();
        label(ctx, goals[1], 52, H / 2 - 60, 80, 'rgba(255,255,255,.1)');
        label(ctx, goals[0], 52, H / 2 + 60, 80, 'rgba(255,255,255,.1)');
        // goals
        for (const [y, c] of [[0, COL[1]], [H - 6, COL[0]]]) {
          ctx.fillStyle = c; ctx.globalAlpha = 0.9; ctx.fillRect(W / 2 - GOAL / 2, y, GOAL, 6); ctx.globalAlpha = 1;
        }
        // mallets
        mallets.forEach((m, i) => {
          ctx.shadowColor = COL[i]; ctx.shadowBlur = 18;
          ctx.fillStyle = COL[i]; ctx.beginPath(); ctx.arc(m.x, m.y, MR, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
          ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.arc(m.x, m.y, MR * 0.62, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.beginPath(); ctx.arc(m.x - MR * 0.25, m.y - MR * 0.25, MR * 0.2, 0, Math.PI * 2); ctx.fill();
        });
        // puck
        ctx.shadowColor = '#fff'; ctx.shadowBlur = 14; ctx.fillStyle = '#f4f1ff';
        ctx.beginPath(); ctx.arc(puck.x, puck.y, PR, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
        ctx.fillStyle = '#9d92c9'; ctx.beginPath(); ctx.arc(puck.x, puck.y, PR * 0.55, 0, Math.PI * 2); ctx.fill();
        particles.draw(ctx);
        labelFlip(ctx, 'Player 2', W - 60, 24, 15, 'rgba(74,168,255,.8)', true);
        labelFlip(ctx, 'Player 1', W - 60, H - 24, 15, 'rgba(255,107,107,.8)', false);
        if (banner) label(ctx, banner, W / 2, H / 2 - 20, 38, '#ffd93d');
      },
    };
    return game;
  },
});


/* --------------------------------------------------------------------------
   Quick Draw  (2 players)
   Wait for DRAW! then tap before your friend does. Jump the gun and you lose
   the round. In later rounds the screen may try to fool you with a fake-out.
   First to 3 rounds wins.
   -------------------------------------------------------------------------- */
registerGame({
  id: 'quick-draw',
  group: 'two',
  name: 'Quick Draw',
  emoji: '🤠',
  color: '#ff8a3d',
  players: 2,
  p1Color: '#ffd93d',
  p2Color: '#2ee6d6',
  blurb: 'Wait for it… then draw faster than your friend.',
  help: 'First to 3 rounds. Wait for DRAW!, then tap your half of the screen (Player 1, bottom: A S D; Player 2, top: J K L). Tap too early and you lose the round. Beware the fake-out!',
  size: [480, 640],

  create(api) {
    const { W, H } = api;
    const WIN_ROUNDS = 3;
    const COL = ['#ffd93d', '#2ee6d6'];
    const KEYS = [['a', 's', 'd'], ['j', 'k', 'l']];
    const particles = makeParticles();
    let phase, t, wait, fakeAt, fakeT, goAt, wins, round, result, flash;

    function startRound() {
      phase = 'wait'; t = 0; result = null; flash = 0;
      const fake = round >= 3 && Math.random() < 0.55;
      wait = rand(1.6, 4.2) + (fake ? 1 : 0);
      fakeAt = fake ? rand(0.8, 1.6) : -1; fakeT = 0;
      api.setInfo(`Round ${round}`);
    }

    function finish(winner, text) {
      phase = 'result'; t = 2.0;
      result = { winner, text };
      if (winner < 0) { api.sound.play('buzz'); return; }
      wins[winner]++; api.setScores(wins[0], wins[1]);
      api.sound.play('whack');
      particles.burst(W / 2, winner === 0 ? H * 0.3 : H * 0.7, COL[winner], 24, 300);
      if (wins[winner] >= WIN_ROUNDS) { phase = 'over'; api.endMatch(winner + 1, `${wins[0]} rounds to ${wins[1]}`); return; }
      round++;
    }

    function pull(i) {
      if (phase === 'wait') {                                  // fired too early (including during the fake-out)
        finish(1 - i, `Player ${i + 1} jumped the gun!`);
      } else if (phase === 'draw') {
        const ms = Math.round(performance.now() - goAt);
        finish(i, `Player ${i + 1} was ${ms} ms`);
      }
    }

    const game = {
      reset() { wins = [0, 0]; round = 1; particles.clear(); api.setScores(0, 0); startRound(); },

      update(dt) {
        particles.update(dt);
        flash = Math.max(0, flash - dt * 3);
        if (phase === 'wait') {
          t += dt;
          if (fakeAt >= 0 && t >= fakeAt && t < fakeAt + 0.5) fakeT = 1; else fakeT = 0;
          if (t >= wait) { phase = 'draw'; goAt = performance.now(); t = 0; flash = 1; api.sound.play('go'); }
        } else if (phase === 'draw') {
          t += dt;
          if (t > 4) { phase = 'result'; t = 1.6; result = { winner: -1, text: 'Nobody drew! Replay' }; }    // both asleep
        } else if (phase === 'result') {
          t -= dt;
          if (t <= 0) startRound();
        }
      },
      idle(dt) { particles.update(dt); },

      pointerdown(p) { pull(p.y > H / 2 ? 0 : 1); },
      keydown(e, k) { KEYS.forEach((set, i) => { if (set.includes(k)) pull(i); }); },

      draw(ctx) {
        const live = phase === 'draw';
        // each half: a desert-sunset colour; the whole board flashes on DRAW
        ctx.fillStyle = live ? '#d94a1f' : '#2a1646'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = live ? '#ff8a3d' : '#3a1d5e'; ctx.fillRect(0, H / 2 - 3, W, 6);
        if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.5})`; ctx.fillRect(0, 0, W, H); }
        // the cowboys
        ctx.font = `90px ${EMOJI_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('🤠', W / 2, H - 120);
        ctx.save(); ctx.translate(W / 2, 120); ctx.rotate(Math.PI); ctx.fillText('🤠', 0, 0); ctx.restore();
        labelFlip(ctx, 'Player 1', W / 2, H - 50, 22, COL[0], false, 0.9);
        labelFlip(ctx, 'Player 2', W / 2, 50, 22, COL[1], true, 0.9);
        if (!api.isTouch()) {
          labelFlip(ctx, 'A S D', W - 60, H - 50, 18, COL[0], false, 0.6);
          labelFlip(ctx, 'J K L', 60, 50, 18, COL[1], true, 0.6);
        }
        // centre message
        let msg = '', col = '#fff', size = 54;
        if (phase === 'wait') { msg = fakeT ? 'Not yet…' : 'Steady…'; col = fakeT ? '#ffd93d' : '#fff'; size = 50; }
        else if (phase === 'draw') { msg = 'DRAW!'; size = 96; }
        else if (result) { msg = result.winner < 0 ? '' : '💥'; }
        label(ctx, msg, W / 2, H / 2, size, col);
        if (result) {
          const y = result.winner < 0 ? H / 2 : (result.winner === 0 ? H / 2 + 60 : H / 2 - 60);
          if (phase !== 'wait') labelFlip(ctx, result.text, W / 2, y, 26, result.winner < 0 ? '#ffd93d' : COL[result.winner], result.winner === 1);
        }
        particles.draw(ctx);
      },
    };
    return game;
  },
});


/* --------------------------------------------------------------------------
   Connect Four  (2 players, taking turns)
   Drop discs into the grid. Get four in a row (across, up-and-down, or
   diagonally) before your friend does.
   -------------------------------------------------------------------------- */
registerGame({
  id: 'connect-four',
  group: 'two',
  name: 'Connect Four',
  emoji: '🔴',
  color: '#3a7bff',
  players: 2,
  scoreboard: false,
  p1Color: '#ff4f6d',
  p2Color: '#ffd93d',
  blurb: 'Line up four discs before your friend does.',
  help: 'Take turns. Tap or click a column to drop a disc. Keyboard: ← → to choose a column, then Space, Enter or ↓ to drop. Players swap who goes first each game.',
  size: [480, 500],

  create(api) {
    const { W, H } = api;
    const COLS = 7, ROWS = 6, S = 62, X0 = (W - COLS * S) / 2, Y0 = 92;
    const COL = ['#ff4f6d', '#ffd93d'];
    const particles = makeParticles();
    let board, turn, col, falling, winCells, over, starter = 0, tick = 0, usedMouse;

    const cx = c => X0 + c * S + S / 2, cy = r => Y0 + r * S + S / 2;
    const colAt = x => clamp(Math.floor((x - X0) / S), 0, COLS - 1);
    const setInfo = () => api.setInfo(over ? '' : `Player ${turn + 1}’s turn`);

    /** Find a winning line through the disc just placed, or null. */
    function findWin(r, c, p) {
      for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
        const line = [[r, c]];
        for (const sgn of [1, -1]) {
          let rr2 = r + dr * sgn, cc = c + dc * sgn;
          while (rr2 >= 0 && rr2 < ROWS && cc >= 0 && cc < COLS && board[rr2][cc] === p) { line.push([rr2, cc]); rr2 += dr * sgn; cc += dc * sgn; }
        }
        if (line.length >= 4) return line;
      }
      return null;
    }

    function drop(c) {
      if (falling || over) return;
      let r = ROWS - 1;
      while (r >= 0 && board[r][c] !== 0) r--;
      if (r < 0) { api.sound.play('buzz'); return; }            // column is full
      board[r][c] = turn + 1;                                   // reserve the slot now; the disc animates down to it
      falling = { c, r, y: Y0 - S / 2, vy: 0, p: turn };
    }

    function landed() {
      const { r, c, p } = falling; falling = null;
      api.sound.play('thud', 400);
      particles.burst(cx(c), cy(r) + S / 3, COL[p], 8, 120);
      const line = findWin(r, c, p + 1);
      if (line) {
        winCells = line; over = true; starter = 1 - p; setInfo();
        for (const [rr2, cc] of line) particles.burst(cx(cc), cy(rr2), COL[p], 10, 220);
        api.endMatch(p + 1, 'Four in a row!');
      } else if (board.every(row => row.every(v => v))) {
        over = true; starter = 1 - starter; setInfo();
        api.endMatch(0, 'The board is full.');
      } else { turn = 1 - turn; setInfo(); }
    }

    const game = {
      reset() {
        board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        turn = starter; col = 3; falling = null; winCells = null; over = false; usedMouse = false; tick = 0; particles.clear();
        setInfo();
      },

      update(dt) {
        tick += dt; particles.update(dt);
        if (falling) {
          falling.vy += 2600 * dt; falling.y += falling.vy * dt;
          const target = cy(falling.r);
          if (falling.y >= target) { falling.y = target; landed(); }
        }
      },
      idle(dt) { tick += dt; particles.update(dt); },

      pointerdown(p, e) { usedMouse = true; col = colAt(p.x); drop(col); },
      pointermove(p, e) { if (e.pointerType === 'mouse') { usedMouse = true; col = colAt(p.x); } },
      keydown(e, k) {
        usedMouse = false;
        if (k === 'arrowleft') col = (col + COLS - 1) % COLS;
        else if (k === 'arrowright') col = (col + 1) % COLS;
        else if (k === ' ' || k === 'enter' || k === 'arrowdown') drop(col);
        else if (k >= '1' && k <= '7') { col = Number(k) - 1; drop(col); }
      },

      draw(ctx) {
        const who = falling ? falling.p : turn;
        // the disc hovering above the board shows whose turn it is and where it will land
        if (!over && !falling) {
          const hx = cx(col), hy = Y0 - S / 2 + Math.sin(tick * 6) * 2;
          ctx.shadowColor = COL[turn]; ctx.shadowBlur = 14; ctx.fillStyle = COL[turn];
          ctx.beginPath(); ctx.arc(hx, hy, S / 2 - 7, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
          ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(X0 + col * S, Y0, S, ROWS * S);        // highlight the chosen column
        }
        // discs sit behind the board so the holes show them
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
          const v = board[r][c];
          if (!v || (falling && falling.r === r && falling.c === c)) continue;
          ctx.fillStyle = COL[v - 1]; ctx.beginPath(); ctx.arc(cx(c), cy(r), S / 2 - 7, 0, Math.PI * 2); ctx.fill();
        }
        if (falling) { ctx.fillStyle = COL[falling.p]; ctx.beginPath(); ctx.arc(cx(falling.c), falling.y, S / 2 - 7, 0, Math.PI * 2); ctx.fill(); }
        // the board: a blue slab with round holes punched out (even-odd fill)
        rr(ctx, X0 - 10, Y0 - 6, COLS * S + 20, ROWS * S + 16, 18);
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { ctx.moveTo(cx(c) + S / 2 - 7, cy(r)); ctx.arc(cx(c), cy(r), S / 2 - 7, 0, Math.PI * 2); }
        ctx.fillStyle = '#2f5be0'; ctx.fill('evenodd');
        ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(X0 - 6, Y0 - 2); ctx.lineTo(X0 + COLS * S + 6, Y0 - 2); ctx.stroke();
        // winning four
        if (winCells) for (const [r, c] of winCells) {
          ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.globalAlpha = 0.6 + 0.4 * Math.sin(tick * 10);
          ctx.beginPath(); ctx.arc(cx(c), cy(r), S / 2 - 3, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
        }
        particles.draw(ctx);
        if (!over) label(ctx, `Player ${who + 1}`, W / 2, 24, 24, COL[who]);
        if (!usedMouse && !over && !api.isTouch()) label(ctx, '← →  then  Space', W / 2, H - 14, 16, 'rgba(255,255,255,.45)');
      },
    };
    return game;
  },
});


/* --------------------------------------------------------------------------
   Big Head Soccer  (1 or 2 players)

   knock it into the other goal. First to 5 goals wins, or whoever is ahead

  color: '#2fd16b',
  players: 'both',
  p1Color: '#ffd93d',
  p2Color: '#ff4f6d',
  blurb: 'Giant heads, tiny feet. Beat the computer or a friend.',
  help: 'First to 5 goals, or lead when 60 seconds are up (a tie is settled by a golden goal). 1 player: A D or ← → to run, W or ↑ to jump, S, Space or ↓ to kick. 2 players: Player 1 (yellow) A D W and S or Space; Player 2 (pink) ← → ↑ and ↓ or Enter. On touch, use the buttons under the pitch.',
  size: [800, 580],

  create(api) {
    const { W, H } = api;
    const PITCH = 470, GROUND = 420, GW = 70, GH = 150;               // pitch height, grass line, goal width, goal height
    const HR = 34, FR = 14, BR = 22, LEG = 58;                        // head, foot and ball radius; leg length
    const STAND = GROUND - HR - 20;                                   // head-centre height when standing
    const MINX = GW + HR, MAXX = W - GW - HR;
