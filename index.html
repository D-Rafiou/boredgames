<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#150d2b">
<title>boredgames</title>
<meta name="description" content="Tiny games for big boredom. Quick, free mini-games that run right in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
<!-- Fonts are optional: if you're offline the page falls back to system fonts. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   boredgames — styles
   Colors and fonts live in :root so the whole look can be re-themed in one place.
   ========================================================================== */
:root {
  --bg: #150d2b;
  --panel: #261a4a;
  --panel-deep: #1d1238;
  --ink: #f6f1ff;
  --muted: #bcaee0;
  --line: #3d2d70;
  --dark: #150d2b;

  --pink: #ff4fa3;
  --orange: #ff8a3d;
  --lemon: #ffd93d;
  --lime: #7bf26b;
  --cyan: #2ee6d6;
  --violet: #8b6cff;

  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font: 600 16px/1.5 var(--body);
  background-color: var(--bg);
  /* soft glow at the top + a faint confetti-dot texture */
  background-image:
    radial-gradient(rgba(255,255,255,.08) 1.5px, transparent 2px),
    radial-gradient(70% 45% at 50% 0%, rgba(139,108,255,.32), transparent 70%);
  background-size: 30px 30px, auto;
  background-repeat: repeat, no-repeat;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

/* ---------- Buttons ---------- */
.btn, .icon-btn {
  font: 400 18px/1 var(--display);
  min-height: 48px;                      /* comfortable touch target */
  color: var(--ink);
  background: var(--panel);
  border: 3px solid var(--line);
  border-radius: 14px;
  padding: 12px 18px;
  cursor: pointer;
  box-shadow: 0 5px 0 rgba(0,0,0,.45);
  transition: transform .08s ease, box-shadow .08s ease, filter .15s ease;
  -webkit-user-select: none; user-select: none;
}
.btn:hover, .icon-btn:hover { filter: brightness(1.15); }
.btn:active, .icon-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.45); }
.btn:disabled, .icon-btn:disabled, .dpad button:disabled { opacity: .4; cursor: not-allowed; filter: none; transform: none; box-shadow: 0 5px 0 rgba(0,0,0,.45); }
.btn-primary { background: var(--c, var(--lemon)); border-color: rgba(0,0,0,.25); color: var(--dark); }
.btn-big { font-size: 24px; padding: 14px 34px; border-radius: 18px; }
.icon-btn { padding: 10px 14px; min-width: 48px; font-size: 20px; }

/* ==========================================================================
   Home
   ========================================================================== */
.hero { position: relative; text-align: center; padding: 56px 16px 30px; }
.hero .mute-btn { position: absolute; top: 14px; right: 14px; }

.wordmark { margin: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 28px; }
.word { display: flex; gap: 6px; }
.tile {
  --c: var(--pink); --r: 0deg;
  display: grid; place-items: center;
  width: clamp(42px, 8vw, 76px); aspect-ratio: 1;
  border-radius: 20%;
  background: var(--c); color: var(--dark);
  font: 400 clamp(30px, 6vw, 56px)/1 var(--display);
  box-shadow: 0 6px 0 rgba(0,0,0,.4), inset 0 -6px 0 rgba(0,0,0,.14);
  transform: rotate(var(--r));
  cursor: pointer; -webkit-user-select: none; user-select: none;
  transition: transform .15s ease;
}
.tile:hover { transform: translateY(-4px) rotate(calc(var(--r) * -1)); }
.tile.boing { animation: boing .5s ease; }
@keyframes boing {
  0%   { transform: scale(1, 1); }
  25%  { transform: translateY(-24px) scale(.9, 1.12); }
  55%  { transform: translateY(0) scale(1.14, .86); }
  80%  { transform: scale(.97, 1.03); }
  100% { transform: scale(1, 1); }
}

.tagline { margin: 22px 0 22px; font: 400 clamp(20px, 3.2vw, 28px)/1.2 var(--display); color: var(--ink); }

.grid {
  list-style: none; margin: 0 auto; padding: 12px 16px 28px; max-width: 1040px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 24px;
}

.card {
  --c: var(--orange);
  display: grid; grid-template-columns: auto 1fr; column-gap: 14px; row-gap: 2px; align-items: center;
  padding: 16px;
  background: var(--panel);
  border: 3px solid var(--c);
  border-radius: 20px;
  color: inherit; text-decoration: none;
  box-shadow: 6px 6px 0 var(--c);
  transition: transform .14s ease, box-shadow .14s ease;
}
.card:hover, .card:focus-visible { transform: translate(-3px, -3px); box-shadow: 9px 9px 0 var(--c); }
.card:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 var(--c); }
.card-emoji {
  grid-row: 1 / span 2;
  width: 64px; height: 64px; display: grid; place-items: center;
  font-size: 36px; border-radius: 16px;
  background: rgba(255,255,255,.08);
  background: color-mix(in srgb, var(--c) 24%, transparent);
}
.card:hover .card-emoji { animation: wiggle .5s ease; }
@keyframes wiggle { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-12deg) scale(1.1) } 75% { transform: rotate(12deg) scale(1.1) } }
.card-name { align-self: end; font: 400 24px/1.1 var(--display); }
.card-desc { align-self: start; color: var(--muted); font-size: 15px; line-height: 1.35; }
.card-best {
  grid-column: 1 / -1; justify-self: start; margin-top: 12px;
  display: inline-flex; gap: 8px; align-items: baseline;
  padding: 4px 12px; border-radius: 999px;
  background: rgba(0,0,0,.3); color: var(--muted);
  font: 800 14px/1.4 var(--body);
  font-variant-numeric: tabular-nums;
}
.card-best b { color: var(--c); font: 400 18px/1 var(--display); }

.foot { text-align: center; color: var(--muted); font-size: 14px; padding: 8px 16px 40px; }

/* ==========================================================================
   Game view
   ========================================================================== */
.gv { --c: var(--orange); max-width: 760px; margin: 0 auto; padding: 14px 16px 36px; }
.gv-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin-bottom: 14px; }
.gv-title { flex: 1 1 auto; margin: 0; font: 400 26px/1.1 var(--display); text-align: center; }
.gv-tools { display: flex; gap: 8px; }

.hud { display: flex; align-items: stretch; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
.hud-item {
  display: flex; align-items: baseline; gap: 8px; padding: 6px 14px; border-radius: 12px;
  background: var(--panel-deep); border: 2px solid var(--line);
}
.hud-k { color: var(--muted); font-size: 14px; font-weight: 800; }
.hud-v { font: 400 26px/1.1 var(--display); color: var(--c); font-variant-numeric: tabular-nums; }
.hud-v.bump { animation: bump .25s ease; }
@keyframes bump { 40% { transform: scale(1.3); } }
.hud-info { display: flex; align-items: center; padding: 6px 14px; color: var(--ink); font-weight: 800; min-height: 40px; }
.hud-info:empty { display: none; }

/* The stage keeps the game's aspect ratio and never grows taller than the screen.
   --chrome = space taken by the header above it; --extra = controls below it (set by JS). */
.gv { --chrome: 250px; }
.stage {
  position: relative;
  width: min(100%, max(240px, calc((100vh - var(--chrome) - var(--extra, 0px)) * var(--ar))));
  width: min(100%, max(240px, calc((100dvh - var(--chrome) - var(--extra, 0px)) * var(--ar))));
  aspect-ratio: var(--ar);
  margin: 0 auto;
  border: 4px solid var(--c);
  border-radius: 22px;
  overflow: hidden;
  background: #120b26;
  box-shadow: 0 0 0 4px #0c0618, 0 18px 40px rgba(0,0,0,.5), 0 0 40px color-mix(in srgb, var(--c) 30%, transparent);
  -webkit-user-select: none; user-select: none;
}
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

.overlay {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 14px;
  background: rgba(14, 8, 32, .8);
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
}
.panel { text-align: center; max-width: 340px; animation: pop .22s ease; }
@keyframes pop { from { transform: scale(.9); opacity: 0; } }
.panel-emoji { font-size: 54px; line-height: 1.1; }
.panel h3 { margin: 4px 0 6px; font: 400 clamp(28px, 6vw, 38px)/1.1 var(--display); }
.panel-blurb { margin: 0 0 6px; font-weight: 800; }
.panel-help { margin: 0 0 18px; color: var(--muted); font-size: 15px; line-height: 1.4; }
.panel-actions { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.final { display: flex; justify-content: center; align-items: baseline; gap: 10px; margin: 6px 0; }
.final span { color: var(--muted); font-weight: 800; }
.final b { font: 400 56px/1 var(--display); color: var(--c); font-variant-numeric: tabular-nums; }
.badge {
  display: inline-block; margin: 0 0 18px; padding: 4px 14px; border-radius: 999px;
  background: var(--lemon); color: var(--dark); font: 400 18px/1.4 var(--display);
  animation: pop .4s ease;
}

.gv-extra { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px; margin-top: 16px; }
.gv-extra:empty { display: none; }
.gv-help { max-width: 520px; margin: 14px auto 0; text-align: center; color: var(--muted); font-size: 14px; }

/* On-screen arrows: only on touch devices */
.dpad { display: none; grid-template: repeat(2, 64px) / repeat(3, 64px); gap: 6px; }
@media (pointer: coarse) { .dpad { display: grid; } }
.dpad button {
  font-size: 24px; color: var(--ink); background: var(--panel); border: 3px solid var(--line); border-radius: 16px;
  box-shadow: 0 4px 0 rgba(0,0,0,.45); touch-action: none; -webkit-user-select: none; user-select: none;
}
.dpad button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.45); }
.dpad [data-d="up"]    { grid-area: 1 / 2; }
.dpad [data-d="left"]  { grid-area: 2 / 1; }
.dpad [data-d="down"]  { grid-area: 2 / 2; }
.dpad [data-d="right"] { grid-area: 2 / 3; }

.hud-vs { display: flex; gap: 8px; }
.hud-p {
  --pc: var(--pink);
  display: flex; align-items: baseline; gap: 8px; padding: 6px 16px; border-radius: 12px;
  background: var(--panel-deep); border: 2px solid var(--pc);
  color: var(--muted); font-weight: 800; font-size: 14px;
}
.hud-p b { font: 400 26px/1.1 var(--display); color: var(--pc); font-variant-numeric: tabular-nums; }
.hud-p b.bump { animation: bump .25s ease; }
.final.vs b { color: inherit; }

.group-head { grid-column: 1 / -1; margin: 18px 0 -4px; }
.group-head:first-child { margin-top: 0; }
.group-head h2 { margin: 0; font: 400 24px/1.2 var(--display); }
.group-head p { margin: 0; color: var(--muted); font-size: 14px; }
.card-foot { grid-column: 1 / -1; margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-foot .card-best { margin-top: 0; }
.card-tag {
  padding: 3px 10px; border-radius: 999px; border: 2px solid var(--c); color: var(--ink);
  font: 800 12px/1.4 var(--body); white-space: nowrap;
}

@media (max-width: 520px) {
  .hero { padding-top: 64px; }
  /* phones: one slim header row + one slim score row so the board gets the space */
  .gv { --chrome: 132px; padding: 10px 16px 28px; }
  .gv-title { display: none; }                         /* the start screen already shows the game's name */
  .gv-top { flex-wrap: nowrap; justify-content: space-between; margin-bottom: 10px; }
  .gv-top .btn, .gv-top .icon-btn { padding: 10px 14px; font-size: 16px; }
  .hud { flex-wrap: nowrap; gap: 6px; margin-bottom: 10px; }
  .hud-item { padding: 3px 10px; }
  .hud-v, .hud-p b { font-size: 22px; }
  .hud-p { padding: 3px 12px; }
  .hud-info { padding: 3px 4px; font-size: 14px; white-space: nowrap; min-height: 0; }
  .gv-extra { margin-top: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>

<body>
<div id="home">
  <header class="hero">
    <button class="icon-btn mute-btn" type="button"></button>
    <h1 class="wordmark" id="wordmark" aria-label="boredgames"></h1>
    <p class="tagline">Tiny games for big boredom.</p>
    <button class="btn btn-primary btn-big" id="randomBtn" type="button">🎲 Random game</button>
  </header>
  <main><ul class="grid" id="grid"></ul></main>
  <p class="foot">High scores are saved in this browser.</p>
</div>

<div id="gameView" hidden></div>

<script>
'use strict';
/* ==========================================================================
   boredgames
   --------------------------------------------------------------------------
   HOW THE CODE IS ORGANIZED
     1. Utilities          small helpers (random, clamp, rounded rects…)
     2. Store / Scores     localStorage wrapper that never throws
     3. Sound              Web Audio sound effects + mute
     4. Particles          tiny confetti helper that games can share
     5. Arena              the shared game "shell": canvas, HUD, start / pause /
                           game-over screens, input, and the game loop
     6. Games              one registerGame({...}) block per game
     7. Home + router      the card grid, Random button and #/game-id routing

   HOW TO ADD A NEW GAME
     Copy any block in section 6 and call registerGame with:
       id, name, emoji, color, blurb (card text), help (how to play),
       size: [width, height]   the game's internal canvas size in pixels
       create(api)             returns an object with these methods:
         reset()               set up a fresh round (called before every play)
         update(dt)            advance the game by dt seconds
         draw(ctx)             paint one frame
         (optional) idle(dt), keydown(e), pointerdown(p), pointermove(p),
                    pointerup(p), destroy()
     The api passed to create() gives you:
         api.W, api.H, api.input, api.sound
         api.setScore(n), api.addScore(n), api.setInfo(text)
         api.end(optionalTitle)         → shows the game-over screen
         api.addAction(label, fn)       → extra button under the game
         api.addDpad(fn)                → on-screen arrows for touch devices
     The card on the home page, high score saving, pause, and the start and
     game-over screens all come for free.
   ========================================================================== */


/* ==========================================================================
   1. Utilities
   ========================================================================== */
const $ = (sel, root = document) => root.querySelector(sel);
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/** Path a rounded rectangle (works in every browser, unlike ctx.roundRect). */
function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/** Draw text on a canvas in the display font. */
function label(ctx, text, x, y, size, color, align = 'center', alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = `400 ${size}px "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}


/* ==========================================================================
   2. Store / Scores — localStorage that fails quietly
   (private windows or blocked storage fall back to memory for the session)
   ========================================================================== */
const Store = (() => {
  const mem = {};
  let ls = null;
  try { ls = window.localStorage; ls.setItem('__t', '1'); ls.removeItem('__t'); } catch (e) { ls = null; }
  return {
    get(k) {
      try { if (ls) return ls.getItem(k); } catch (e) { /* fall through */ }
      return k in mem ? mem[k] : null;
    },
    set(k, v) {
      mem[k] = String(v);
      try { if (ls) ls.setItem(k, String(v)); } catch (e) { /* memory copy still works */ }
    },
  };
})();

const Scores = {
  key: id => `boredgames:best:${id}`,
  get(id) {
    const n = parseInt(Store.get(this.key(id)), 10);
    return Number.isFinite(n) && n > 0 ? n : 0;
  },
  /** Save a score if it's a new best. Returns { best, isNew }. lower = true for games where a smaller number wins. */
  submit(id, score, lower = false) {
    const prev = this.get(id), s = Math.floor(score);
    const isNew = lower ? (prev === 0 || s < prev) : s > prev;
    if (isNew) Store.set(this.key(id), s);
    return { best: isNew ? s : prev, isNew };
  },
};

/** How many 2-player matches have been finished (shown on the card, since 2-player games have no personal best). */
const Plays = {
  key: id => `boredgames:plays:${id}`,
  get(id) { const n = parseInt(Store.get(this.key(id)), 10); return Number.isFinite(n) && n > 0 ? n : 0; },
  inc(id) { Store.set(this.key(id), this.get(id) + 1); },
};


/* ==========================================================================
   3. Sound — tiny synthesized effects, no audio files
   ========================================================================== */
const Sound = (() => {
  let ac = null;
  let muted = Store.get('boredgames:muted') === '1';
  const lastPlayed = {};
  const listeners = [];

  function ctx() {
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }

  /** One short beep. f = start Hz, to = end Hz (slide), t = seconds, delay = seconds. */
  function tone({ f, to, t = 0.1, type = 'square', v = 0.1, delay = 0 }) {
    const c = ctx(); if (!c) return;
    const t0 = c.currentTime + delay;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f, t0);
    if (to) osc.frequency.exponentialRampToValueAtTime(to, t0 + t);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + t);
    osc.connect(g); g.connect(c.destination);
    osc.start(t0); osc.stop(t0 + t + 0.03);
  }

  const arp = (notes, step, opts) => notes.forEach((f, i) => tone({ f, delay: i * step, ...opts }));
  const PENTA = [262, 294, 330, 392, 440, 523, 587, 659, 784, 880];

  // Each effect is a function so it can take one number (pitch, intensity…).
  const effects = {
    click:    () => tone({ f: 520, to: 780, t: 0.07, v: 0.07 }),
    paddle:   () => tone({ f: 200, to: 320, t: 0.08, type: 'square', v: 0.09 }),
    wall:     () => tone({ f: 160, to: 130, t: 0.05, type: 'triangle', v: 0.08 }),
    brick:    row => tone({ f: 420 + (row || 0) * 45, to: 700 + (row || 0) * 60, t: 0.08, type: 'square', v: 0.07 }),
    tink:     () => tone({ f: 900, t: 0.05, type: 'sine', v: 0.09 }),
    launch:   () => tone({ f: 260, to: 720, t: 0.14, type: 'square', v: 0.08 }),
    lose:     () => tone({ f: 420, to: 70, t: 0.45, type: 'sawtooth', v: 0.09 }),
    levelup:  () => arp([523, 659, 784, 1047], 0.09, { t: 0.12, type: 'square', v: 0.07 }),
    eat:      () => tone({ f: 600, to: 1000, t: 0.08, type: 'square', v: 0.07 }),
    drop:     () => tone({ f: rand(260, 360), to: 150, t: 0.1, type: 'sine', v: 0.1 }),
    thud:     speed => tone({ f: rand(120, 170), to: 60, t: 0.09, type: 'sine', v: clamp((speed || 300) / 2500, 0.03, 0.12) }),
    tick:     () => tone({ f: rand(700, 900), to: 500, t: 0.03, type: 'triangle', v: 0.04 }),
    shake:    () => tone({ f: 120, to: 60, t: 0.25, type: 'sawtooth', v: 0.06 }),
    gameover: () => arp([392, 330, 262], 0.16, { t: 0.2, type: 'triangle', v: 0.1 }),
    newbest:  () => arp([523, 659, 784, 1047, 1319], 0.1, { t: 0.14, type: 'square', v: 0.07 }),
    note:     i => tone({ f: PENTA[(i || 0) % PENTA.length] * 2, t: 0.3, type: 'triangle', v: 0.13 }),
    win:      () => arp([523, 659, 784, 1047, 784, 1047], 0.09, { t: 0.14, type: 'square', v: 0.07 }),
    goal:     () => arp([392, 523, 659, 784], 0.08, { t: 0.14, type: 'square', v: 0.08 }),
    pop:      () => tone({ f: 500, to: 900, t: 0.06, type: 'sine', v: 0.1 }),
    buzz:     () => tone({ f: 170, to: 110, t: 0.28, type: 'sawtooth', v: 0.09 }),
    flap:     () => tone({ f: 320, to: 560, t: 0.07, type: 'square', v: 0.06 }),
    whack:    () => tone({ f: 260, to: 70, t: 0.12, type: 'triangle', v: 0.14 }),
    gold:     () => arp([880, 1175, 1568], 0.06, { t: 0.1, type: 'square', v: 0.07 }),
    flip:     () => tone({ f: 700, to: 500, t: 0.04, type: 'sine', v: 0.07 }),
    match:    () => arp([659, 880], 0.08, { t: 0.12, type: 'triangle', v: 0.1 }),
    peg:      () => tone({ f: rand(900, 1500), t: 0.03, type: 'sine', v: 0.04 }),
    beep:     () => tone({ f: 440, t: 0.1, type: 'sine', v: 0.1 }),
    go:       () => tone({ f: 880, t: 0.18, type: 'square', v: 0.09 }),
    simon:    i => tone({ f: [330, 262, 392, 523][(i || 0) % 4], t: 0.34, type: 'sine', v: 0.16 }),
    kick:     () => tone({ f: 180, to: 90, t: 0.1, type: 'triangle', v: 0.13 }),
    tap:      () => tone({ f: 600, to: 760, t: 0.04, type: 'square', v: 0.05 }),
  };

  return {
    /** Browsers only allow audio after a tap/click/key, so we wake it up on the first one. */
    unlock() { ctx(); },
    play(name, arg) {
      if (muted || !effects[name]) return;
      const now = performance.now();
      if (now - (lastPlayed[name] || 0) < 35) return;   // stop rapid repeats from piling up
      lastPlayed[name] = now;
      try { effects[name](arg); } catch (e) { /* audio is never worth crashing a game */ }
    },
    isMuted: () => muted,
    toggleMute() {
      muted = !muted;
      Store.set('boredgames:muted', muted ? '1' : '0');
      listeners.forEach(fn => fn(muted));
      if (!muted) this.play('click');
    },
    onChange(fn) { listeners.push(fn); },
  };
})();

['pointerdown', 'keydown', 'touchstart'].forEach(ev =>
  document.addEventListener(ev, () => Sound.unlock(), { passive: true }));

/** Keep every mute button (home + game view) showing the same state. */
function refreshMuteButtons() {
  const m = Sound.isMuted();
  document.querySelectorAll('.mute-btn').forEach(b => {
    b.textContent = m ? '🔇' : '🔊';
    b.setAttribute('aria-label', m ? 'Unmute sound' : 'Mute sound');
    b.setAttribute('aria-pressed', String(m));
    b.title = m ? 'Unmute' : 'Mute';
  });
}
Sound.onChange(refreshMuteButtons);
document.addEventListener('click', e => {
  if (e.target.closest('.mute-btn')) Sound.toggleMute();
});


/* ==========================================================================
   4. Particles — a few flying squares for juice
   ========================================================================== */
function makeParticles() {
  const list = [];
  return {
    burst(x, y, color, n = 10, speed = 200) {
      for (let i = 0; i < n; i++) {
        const life = rand(0.3, 0.7);
        list.push({ x, y, vx: rand(-1, 1) * speed, vy: rand(-1, 1) * speed, life, max: life, size: rand(2, 5), color });
      }
    },
    update(dt) {
      for (let i = list.length - 1; i >= 0; i--) {
        const p = list[i];
        p.life -= dt;
        if (p.life <= 0) { list.splice(i, 1); continue; }
        p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt;
      }
    },
    draw(ctx) {
      for (const p of list) {
        ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      }
      ctx.globalAlpha = 1;
    },
    clear() { list.length = 0; },
  };
}


/* ==========================================================================
   5. Arena — the shared shell every game plays inside
   Builds the game screen, runs the loop, and owns the state machine:
       start → playing ⇄ paused → over → (play again) → playing …

   A game can be 1-player (default), 2-player (def.players = 2) or both
   (def.players = 'both': the start screen asks "1 player or 2 players?").
   Solo games report a score; 2-player games report a winner.
   ========================================================================== */
function createArena(def, root, { onExit }) {
  const [W, H] = def.size;
  const SCALE = clamp(window.devicePixelRatio || 1, 1, 2);   // sharper canvas on retina screens
  const players = def.players || 1;                          // 1 | 2 | 'both'
  const scoring = def.scoring || {};                         // e.g. { lower: true, unit: ' ms' }
  const unit = scoring.unit || '';
  const P1C = def.p1Color || '#ff4fa3', P2C = def.p2Color || '#2ee6d6';

  root.innerHTML = `
    <div class="gv" style="--c:${def.color}">
      <div class="gv-top">
        <button class="btn" type="button" data-act="back">← Back to games</button>
        <h2 class="gv-title"><span aria-hidden="true">${def.emoji}</span> ${def.name}</h2>
        <div class="gv-tools">
          <button class="btn" type="button" data-act="pause" title="Pause (P)">Pause</button>
          <button class="icon-btn mute-btn" type="button"></button>
        </div>
      </div>
      <div class="hud">
        <div class="hud-item" data-el="scoreBox"><span class="hud-k">Score</span><span class="hud-v" data-el="score">0</span></div>
        <div class="hud-item" data-el="bestBox"><span class="hud-k">Best</span><span class="hud-v" data-el="best">0</span></div>
        <div class="hud-vs" data-el="vs" hidden>
          <span class="hud-p" style="--pc:${P1C}">Player 1 <b data-el="s1">0</b></span>
          <span class="hud-p" style="--pc:${P2C}">Player 2 <b data-el="s2">0</b></span>
        </div>
        <div class="hud-info" data-el="info"></div>
      </div>
      <div class="stage" style="--ar:${W / H}">
        <canvas width="${W * SCALE}" height="${H * SCALE}" aria-label="${def.name} game board"></canvas>
        <div class="overlay" data-el="overlay"></div>
      </div>
      <div class="gv-extra" data-el="extra"></div>
      <p class="gv-help">${def.help}</p>
    </div>`;
  refreshMuteButtons();

  const q = name => root.querySelector(`[data-el="${name}"]`);
  const canvas = root.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = q('score'), bestEl = q('best'), infoEl = q('info'), overlay = q('overlay'), extra = q('extra');
  const s1El = q('s1'), s2El = q('s2');
  const pauseBtn = root.querySelector('[data-act="pause"]');
  const helpEl = root.querySelector('.gv-help');
  const stage = root.querySelector('.stage');

  // ----- state -----
  let state = 'start';            // 'start' | 'playing' | 'paused' | 'over'
  let mode = players === 2 ? '2p' : '1p';
  let score = 0;
  let best = Scores.get(def.id);
  let s1 = 0, s2 = 0, scoresSet = false;       // live 2-player scoreboard
  const series = { a: 0, b: 0 };               // wins this visit (resets when you leave the game)
  let raf = 0, lastT = null, overTimer = 0, game = null, sawTouch = false;
  const coarse = window.matchMedia && matchMedia('(pointer: coarse)');
  const input = { keys: new Set(), ptr: { x: W / 2, y: H / 2, down: false, inside: false } };

  // ----- the api each game receives -----
  const api = {
    W, H, input, sound: Sound,
    get mode() { return mode; },                              // '1p' or '2p'
    get score() { return score; },
    isTouch() { return sawTouch || !!(coarse && coarse.matches); },
    setScore(n) { score = Math.max(0, Math.floor(n)); renderScore(); },
    addScore(n) { api.setScore(score + n); },
    /** 2-player scoreboard (goals, rounds won…). */
    setScores(a, b) {
      const bumpA = a !== s1, bumpB = b !== s2;
      s1 = a; s2 = b; scoresSet = true;
      s1El.textContent = a; s2El.textContent = b;
      for (const [on, el] of [[bumpA, s1El], [bumpB, s2El]]) if (on) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
    },
    setInfo(text) { if (infoEl.textContent !== text) infoEl.textContent = text; },
    /** Solo games: show the game-over screen with the score. */
    end(title) { endGame(title); },
    /** 2-player games: winner is 1, 2, or 0 for a draw. */
    endMatch(winner, detail) { endMatch(winner, detail); },
    addAction(text, fn) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn'; b.textContent = text;
      b.addEventListener('click', e => { if (state === 'playing') fn(); if (e.detail > 0) b.blur(); });
      extra.appendChild(b);
    },
    addDpad(fn) {
      const d = document.createElement('div');
      d.className = 'dpad';
      d.innerHTML = '<button type="button" data-d="up" aria-label="Up">▲</button><button type="button" data-d="left" aria-label="Left">◀</button><button type="button" data-d="down" aria-label="Down">▼</button><button type="button" data-d="right" aria-label="Right">▶</button>';
      d.addEventListener('pointerdown', e => {
        const b = e.target.closest('[data-d]');
        if (!b) return;
        e.preventDefault();
        if (state === 'playing') fn(b.dataset.d);
      });
      extra.appendChild(d);
    },
  };

  // ----- HUD -----
  const fmt = n => (scoring.lower && n === 0) ? '–' : n + unit;
  function renderScore() {
    scoreEl.textContent = fmt(score);
    scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump');
  }
  function applyMode() {
    const two = mode === '2p';
    q('scoreBox').hidden = two; q('bestBox').hidden = two; q('vs').hidden = !two || def.scoreboard === false;
  }
  bestEl.textContent = fmt(best);
  applyMode();

  // ----- overlays (start / paused / game over) -----
  function showOverlay(html) {
    overlay.innerHTML = `<div class="panel">${html}</div>`;
    overlay.hidden = false;
    const primary = overlay.querySelector('[data-focus]');
    if (primary) primary.focus({ preventScroll: true });
  }
  function showStart() {
    const buttons = players === 'both'
      ? `<div class="panel-actions">
           <button class="btn btn-primary btn-big" type="button" data-act="play" data-mode="1p" data-focus>1 player</button>
           <button class="btn btn-big" type="button" data-act="play" data-mode="2p">2 players</button>
         </div>`
      : `<button class="btn btn-primary btn-big" type="button" data-act="play" data-focus>Play</button>`;
    showOverlay(`
      <div class="panel-emoji" aria-hidden="true">${def.emoji}</div>
      <h3>${def.name}</h3>
      <p class="panel-blurb">${def.blurb}</p>
      <p class="panel-help">${def.help}</p>
      ${buttons}`);
  }
  function showPaused() {
    showOverlay(`
      <h3>Paused</h3>
      <p class="panel-help">Your game is waiting.</p>
      <div class="panel-actions">
        <button class="btn btn-primary btn-big" type="button" data-act="resume" data-focus>Resume</button>
        <button class="btn" type="button" data-act="back">Back to games</button>
      </div>`);
  }
  function showGameOver(title, isNew) {
    showOverlay(`
      <h3>${title}</h3>
      <div class="final"><span>Score</span><b>${fmt(score)}</b></div>
      ${isNew ? '<p class="badge">New best!</p>' : (best > 0 ? `<p class="panel-help">Best: ${fmt(best)}</p>` : '<p class="panel-help"></p>')}
      <div class="panel-actions">
        <button class="btn btn-primary btn-big" type="button" data-act="play" data-mode="${mode}" data-focus>Play again</button>
        <button class="btn" type="button" data-act="back">Back to games</button>
      </div>`);
  }
  function showMatchOver(winner, detail) {
    const col = winner === 1 ? P1C : winner === 2 ? P2C : '#ffd93d';
    const title = winner === 0 ? 'It’s a draw!' : `Player ${winner} wins!`;
    showOverlay(`
      <h3 style="color:${col}">${title}</h3>
      ${detail ? `<p class="panel-blurb">${detail}</p>` : ''}
      ${scoresSet ? `<div class="final vs"><b style="color:${P1C}">${s1}</b><span>to</span><b style="color:${P2C}">${s2}</b></div>` : ''}
      <p class="panel-help">Series: Player 1 ${series.a}, Player 2 ${series.b}</p>
      <div class="panel-actions">
        <button class="btn btn-primary btn-big" type="button" data-act="play" data-mode="${mode}" data-focus>Play again</button>
        <button class="btn" type="button" data-act="back">Back to games</button>
      </div>`);
  }

  // ----- state transitions -----
  function setPauseIcon() {
    const canPause = state === 'playing' || state === 'paused';
    pauseBtn.disabled = !canPause;
    pauseBtn.textContent = state === 'paused' ? 'Resume' : 'Pause';
    extra.querySelectorAll('button').forEach(b => { b.disabled = state !== 'playing'; });   // Shake, Done, arrows…
    helpEl.hidden = state === 'start';          // the start screen already shows how to play
  }
  function startGame(chosen) {
    clearTimeout(overTimer);
    if (chosen === '1p' || chosen === '2p') mode = chosen;
    else if (players !== 'both') mode = players === 2 ? '2p' : '1p';
    applyMode();
    score = 0; renderScore();
    s1 = 0; s2 = 0; scoresSet = false; s1El.textContent = 0; s2El.textContent = 0;
    game.reset();
    state = 'playing';
    overlay.hidden = true;
    lastT = null;
    setPauseIcon();
  }
  function pauseGame() {
    if (state !== 'playing') return;
    state = 'paused'; showPaused(); setPauseIcon();
  }
  function resumeGame() {
    if (state !== 'paused') return;
    state = 'playing'; overlay.hidden = true; lastT = null; setPauseIcon();
  }
  function endGame(title) {
    if (state !== 'playing') return;
    state = 'over';
    setPauseIcon();
    const res = score > 0 ? Scores.submit(def.id, score, !!scoring.lower) : { best, isNew: false };
    best = res.best; bestEl.textContent = fmt(best);
    Sound.play(res.isNew ? 'newbest' : 'gameover');
    // brief beat so you can see what happened before the screen covers it
    overTimer = setTimeout(() => showGameOver(title || 'Game over', res.isNew), 550);
  }
  function endMatch(winner, detail) {
    if (state !== 'playing') return;
    state = 'over';
    setPauseIcon();
    if (winner === 1) series.a++; else if (winner === 2) series.b++;
    Plays.inc(def.id);
    Sound.play('win');
    overTimer = setTimeout(() => showMatchOver(winner, detail), 700);
  }

  // ----- clicks on any [data-act] button inside the arena -----
  function onClick(e) {
    const b = e.target.closest('[data-act]');
    if (!b || !root.contains(b)) return;
    if (e.detail > 0 && (b === pauseBtn)) b.blur();       // don't leave focus on a button that Space would re-trigger
    switch (b.dataset.act) {
      case 'play':   Sound.play('click'); startGame(b.dataset.mode); break;
      case 'resume': Sound.play('click'); resumeGame(); break;
      case 'pause':  state === 'paused' ? resumeGame() : pauseGame(); break;
      case 'back':   Sound.play('click'); onExit(); break;
    }
  }
  root.addEventListener('click', onClick);

  // ----- pointer input (mouse + touch + pen all go through Pointer Events) -----
  // Every callback gets the pointer event too, so a game can tell fingers apart with e.pointerId.
  function toLocal(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  }
  canvas.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse') sawTouch = true;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* not fatal */ }
    const p = toLocal(e);
    Object.assign(input.ptr, p, { down: true, inside: true });
    if (state === 'playing' && game.pointerdown) game.pointerdown(p, e);
  });
  canvas.addEventListener('pointermove', e => {
    const p = toLocal(e);
    Object.assign(input.ptr, p, { inside: true });
    if (state === 'playing' && game.pointermove) game.pointermove(p, e);
  });
  const pointerEnd = e => {
    const p = toLocal(e);
    input.ptr.down = false;
    if (e.pointerType !== 'mouse') input.ptr.inside = false;
    if (state === 'playing' && game.pointerup) game.pointerup(p, e);
  };
  canvas.addEventListener('pointerup', pointerEnd);
  canvas.addEventListener('pointercancel', pointerEnd);
  canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') input.ptr.inside = false; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  // ----- keyboard input -----
  const GAME_KEYS = new Set(['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' ']);
  function onKeyDown(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    input.keys.add(k);
    if (k === 'p' || k === 'escape') {
      if (state === 'playing') pauseGame(); else if (state === 'paused') resumeGame();
      return;
    }
    if (state !== 'playing') return;
    if (GAME_KEYS.has(k)) e.preventDefault();             // keep arrows/space from scrolling the page
    if (game.keydown && !e.repeat) game.keydown(e, k);
  }
  function onKeyUp(e) { input.keys.delete(e.key.toLowerCase()); }
  function onBlur() { input.keys.clear(); }
  function onVisibility() { if (document.hidden) pauseGame(); }
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  window.addEventListener('blur', onBlur);
  document.addEventListener('visibilitychange', onVisibility);

  // ----- game loop -----
  function frame(t) {
    raf = requestAnimationFrame(frame);
    if (lastT == null) lastT = t;
    const dt = Math.min((t - lastT) / 1000, 0.05);          // cap so a lag spike can't teleport things
    lastT = t;

    if (state === 'playing') game.update(dt);
    else if ((state === 'start' || state === 'over') && game.idle) game.idle(dt);

    ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
    ctx.fillStyle = '#120b26';
    ctx.fillRect(0, 0, W, H);
    game.draw(ctx);
  }

  // Reserve room for controls under the board (Snake's arrows, Ball Pit's buttons) so they stay on screen.
  function fitExtra() {
    const h = extra.offsetHeight;
    stage.style.setProperty('--extra', h ? `${h + 16}px` : '0px');
  }
  window.addEventListener('resize', fitExtra);

  // ----- go -----
  game = def.create(api);
  fitExtra();
  game.reset();                       // so the start screen has a board behind it
  setPauseIcon();
  showStart();
  raf = requestAnimationFrame(frame);

  return {
    /** Tear everything down so nothing keeps running after "Back to games". */
    destroy() {
      cancelAnimationFrame(raf);
      clearTimeout(overTimer);
      // leaving mid-game still counts for solo games that count upward: save the score you earned
      if ((state === 'playing' || state === 'paused') && score > 0 && mode === '1p' && !scoring.lower) Scores.submit(def.id, score);
      window.removeEventListener('keydown', onKeyDown);
      window.removeEventListener('keyup', onKeyUp);
      window.removeEventListener('blur', onBlur);
      window.removeEventListener('resize', fitExtra);
      document.removeEventListener('visibilitychange', onVisibility);
      if (game && game.destroy) game.destroy();
      root.removeEventListener('click', onClick);
      root.innerHTML = '';
    },
  };
}


/**
 * On-canvas touch buttons that work with several fingers at once (handy for 2-player games on one phone).
 * Call down/move/up from the game's pointer handlers, then read isDown(id) / pressed(id) in update().
 *   buttons: [{ id, x, y, w, h, label, color, flip }]   (logical canvas coordinates; flip = text upside down for the player across the table)
 * Buttons are only drawn on touch devices; on desktop the keyboard hints do that job.
 */
function makeTouchPad(api, buttons) {
  const held = new Map();                 // pointerId -> button id
  const edge = new Set();                 // ids pressed since the last pressed() check
  const hit = p => buttons.find(b => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h);
  const press = (pid, b) => { held.set(pid, b.id); edge.add(b.id); };
  const pad = {
    down(p, e) { const b = hit(p); if (b) { press(e.pointerId, b); return true; } return false; },
    move(p, e) {
      if (!held.has(e.pointerId)) return;
      const b = hit(p);
      if (!b) held.delete(e.pointerId); else if (b.id !== held.get(e.pointerId)) press(e.pointerId, b);
    },
    up(p, e) { held.delete(e.pointerId); },
    isDown(id) { for (const v of held.values()) if (v === id) return true; return false; },
    pressed(id) { const had = edge.has(id); edge.delete(id); return had; },
    reset() { held.clear(); edge.clear(); },
    draw(ctx) {
      if (!api.isTouch()) return;
      for (const b of buttons) {
        const on = pad.isDown(b.id);
        ctx.globalAlpha = on ? 0.95 : 0.55;
        ctx.fillStyle = b.color || '#8b6cff';
        rr(ctx, b.x, b.y, b.w, b.h, 16); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.save();
        ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
        if (b.flip) ctx.rotate(Math.PI);
        label(ctx, b.label, 0, 2, Math.min(34, b.h * 0.5), '#150d2b');
        ctx.restore();
      }
    },
  };
  return pad;
}


/* ==========================================================================
   6. Games
   ========================================================================== */
const GAMES = [];
function registerGame(def) { GAMES.push(def); }


/* --------------------------------------------------------------------------
   Brick Breaker
   Clear every brick. Each level adds rows, speeds the ball up and narrows the
   paddle; from level 3 the top rows take two hits.
   -------------------------------------------------------------------------- */
registerGame({
  id: 'brick-breaker',
  group: 'balls',
  name: 'Brick Breaker',
  emoji: '🧱',
  color: '#ff8a3d',
  blurb: 'Smash every brick with one bouncy ball.',
  help: 'Move the paddle with your mouse, your finger, or the ← → keys. Click, tap, or press Space to launch the ball.',
  size: [480, 640],

  create(api) {
    const { W, H } = api;
    const COLS = 8, MARGIN = 20, GAP = 6, TOP = 70;
    const BW = (W - MARGIN * 2 - GAP * (COLS - 1)) / COLS;
    const BH = 20;
    const R = 7;                                   // ball radius
    const ROW_COLORS = ['#ff4fa3', '#ff8a3d', '#ffd93d', '#7bf26b', '#2ee6d6', '#8b6cff', '#ff4fa3', '#ff8a3d'];
    const paddle = { x: W / 2, y: H - 48, w: 92, h: 12 };
    const particles = makeParticles();

    let bricks, ball, level, lives, stuck, bricksLeft, bricksTotal, banner;

    const baseSpeed = () => Math.min(620, 380 + (level - 1) * 30);
    // the ball also speeds up as the level empties out (up to +35%)
    const currentSpeed = () => Math.min(760, baseSpeed() * (1 + 0.35 * (1 - bricksLeft / bricksTotal)));

    function updateInfo() { api.setInfo(`Level ${level}   ${'❤️'.repeat(lives)}`); }

    function buildLevel() {
      const rows = Math.min(2 + level, 8);                            // 3 rows to start, up to 8
      const hardRows = level >= 3 ? Math.min(level - 2, 3) : 0;      // top rows that take 2 hits
      const holeChance = Math.min(0.04 * (level - 1), 0.16);          // a few gaps on later levels
      bricks = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < COLS; c++) {
          if (level > 1 && Math.random() < holeChance) continue;
          bricks.push({
            x: MARGIN + c * (BW + GAP), y: TOP + r * (BH + GAP), row: r,
            hp: r < hardRows ? 2 : 1, color: ROW_COLORS[r % ROW_COLORS.length], alive: true,
          });
        }
      }
      bricksLeft = bricksTotal = bricks.length;
      paddle.w = Math.max(64, 92 - (level - 1) * 4);
      paddle.x = clamp(paddle.x, paddle.w / 2, W - paddle.w / 2);
    }

    function parkBall() {
      stuck = true;
      ball = { x: paddle.x, y: paddle.y - paddle.h / 2 - R - 1, vx: 0, vy: 0 };
    }

    function launch() {
      if (!stuck) return;
      stuck = false;
      const a = rand(-0.35, 0.35);                 // slightly off-vertical
      const s = currentSpeed();
      ball.vx = Math.sin(a) * s; ball.vy = -Math.cos(a) * s;
      api.sound.play('launch');
    }

    function loseLife() {
      lives--;
      api.sound.play('lose');
      updateInfo();
      if (lives <= 0) { api.end('Out of lives'); return; }
      parkBall();
    }

    function levelClear() {
      level++;
      api.addScore(100);
      api.sound.play('levelup');
      buildLevel(); parkBall(); updateInfo();
      banner = { text: `Level ${level}`, t: 1.4 };
    }

    function damage(b) {
      b.hp--;
      if (b.hp > 0) { api.sound.play('tink'); return; }
      b.alive = false; bricksLeft--;
      api.addScore(10 * level);
      api.sound.play('brick', b.row);
      particles.burst(b.x + BW / 2, b.y + BH / 2, b.color, 10);
      if (bricksLeft === 0) levelClear();
    }

    /** Circle-vs-rectangle test against every live brick; bounce off the first one touched. */
    function hitBricks() {
      for (const b of bricks) {
        if (!b.alive) continue;
        const cx = clamp(ball.x, b.x, b.x + BW), cy = clamp(ball.y, b.y, b.y + BH);
        const dx = ball.x - cx, dy = ball.y - cy;
        if (dx * dx + dy * dy >= R * R) continue;
        if (dx === 0 && dy === 0) {
          ball.vy = -ball.vy;                        // centre is inside the brick: just flip
        } else {
          const d = Math.sqrt(dx * dx + dy * dy), nx = dx / d, ny = dy / d;
          ball.x += nx * (R - d); ball.y += ny * (R - d);   // push out
          const dot = ball.vx * nx + ball.vy * ny;
          if (dot < 0) { ball.vx -= 2 * dot * nx; ball.vy -= 2 * dot * ny; }  // reflect
        }
        damage(b);
        return true;
      }
      return false;
    }

    function moveBall(dt) {
      // keep the speed exactly where we want it, and never let the ball go (almost) flat
      const s = currentSpeed();
      if (Math.abs(ball.vy) < s * 0.22) ball.vy = (ball.vy < 0 ? -1 : 1) * s * 0.22;
      const m = Math.hypot(ball.vx, ball.vy) || 1;
      ball.vx = ball.vx / m * s; ball.vy = ball.vy / m * s;

      // move in small steps so a fast ball can't skip through a brick
      const steps = Math.max(1, Math.ceil(s * dt / 4)), h = dt / steps;
      for (let i = 0; i < steps; i++) {
        ball.x += ball.vx * h; ball.y += ball.vy * h;

        if (ball.x < R)       { ball.x = R;       ball.vx =  Math.abs(ball.vx); api.sound.play('wall'); }
        else if (ball.x > W - R) { ball.x = W - R; ball.vx = -Math.abs(ball.vx); api.sound.play('wall'); }
        if (ball.y < R)       { ball.y = R;       ball.vy =  Math.abs(ball.vy); api.sound.play('wall'); }

        // paddle: where the ball lands decides the angle (edges = steeper)
        if (ball.vy > 0 && ball.y < paddle.y && ball.y + R >= paddle.y - paddle.h / 2 &&
            Math.abs(ball.x - paddle.x) <= paddle.w / 2 + R) {
          const off = clamp((ball.x - paddle.x) / (paddle.w / 2), -1, 1);
          const ang = off * 1.05;                                   // up to ~60° from vertical
          ball.vx = Math.sin(ang) * s; ball.vy = -Math.cos(ang) * s;
          ball.y = paddle.y - paddle.h / 2 - R;
          api.sound.play('paddle');
        }

        if (hitBricks() && stuck) return;          // level cleared during this step
        if (ball.y - R > H) { loseLife(); return; }
      }
    }

    return {
      reset() {
        level = 1; lives = 3; banner = null;
        paddle.x = api.input.ptr.inside ? clamp(api.input.ptr.x, 46, W - 46) : W / 2;
        buildLevel(); parkBall(); particles.clear(); updateInfo();
      },

      update(dt) {
        const k = api.input.keys;
        const dir = (k.has('arrowright') || k.has('d') ? 1 : 0) - (k.has('arrowleft') || k.has('a') ? 1 : 0);
        paddle.x = clamp(paddle.x + dir * 560 * dt, paddle.w / 2, W - paddle.w / 2);
        if (stuck) { ball.x = paddle.x; ball.y = paddle.y - paddle.h / 2 - R - 1; }
        else moveBall(dt);
        particles.update(dt);
        if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
      },

      idle(dt) { particles.update(dt); },

      keydown(e, k) { if (k === ' ' || k === 'arrowup' || k === 'w') launch(); },
      pointerdown(p) { paddle.x = clamp(p.x, paddle.w / 2, W - paddle.w / 2); launch(); },
      pointermove(p) { paddle.x = clamp(p.x, paddle.w / 2, W - paddle.w / 2); },

      draw(ctx) {
        // bricks
        for (const b of bricks) {
          if (!b.alive) continue;
          ctx.fillStyle = b.color; rr(ctx, b.x, b.y, BW, BH, 5); ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,.3)'; rr(ctx, b.x + 2, b.y + 2, BW - 4, 5, 3); ctx.fill();
          if (b.hp > 1) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; rr(ctx, b.x + 1, b.y + 1, BW - 2, BH - 2, 5); ctx.stroke(); }
        }
        // paddle
        ctx.shadowColor = '#ff8a3d'; ctx.shadowBlur = 14;
        ctx.fillStyle = '#ffb066'; rr(ctx, paddle.x - paddle.w / 2, paddle.y - paddle.h / 2, paddle.w, paddle.h, 6); ctx.fill();
        ctx.shadowBlur = 0;
        // ball
        ctx.shadowColor = '#fff'; ctx.shadowBlur = 12;
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ball.x, ball.y, R, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;

        particles.draw(ctx);

        if (stuck) label(ctx, 'Tap or press Space to launch', W / 2, H * 0.62, 22, '#fff', 'center', 0.6 + 0.4 * Math.sin(performance.now() / 250));
        if (banner) label(ctx, banner.text, W / 2, H * 0.5, 54, '#ffd93d', 'center', clamp(banner.t, 0, 1));
      },
    };
  },
});


/* --------------------------------------------------------------------------
   Ball Pit
   A toy sandbox. Click (or hold and drag) to drop balls. Your score is how many
   you drop before the pile stays above the red line for 2 seconds. The balls
   get bigger as you go, so the pit fills faster and faster.
   -------------------------------------------------------------------------- */
registerGame({
  id: 'ball-pit',
  group: 'balls',
  name: 'Ball Pit',
  emoji: '🎱',
  color: '#2ee6d6',
  blurb: 'Drop balls and watch them pile up.',
  help: 'Click or tap to drop a ball. Hold and drag to pour. Keep the pile below the red line, or press Done when you’ve had enough.',
  size: [480, 640],

  create(api) {
    const { W, H } = api;
    const LINE = 130;                    // the "full" line
    const GRAVITY = 1500;
    const SUBSTEPS = 6;                  // physics steps per frame (smaller steps = steadier piles)
    const ITERATIONS = 4;                // how many times each step re-separates touching balls
    const E_WALL = 0.55, E_BALL = 0.45;  // bounciness
    const BOUNCE_MIN = 150;              // gentler contacts don't bounce, so piles settle instead of fizzing
    const MAX_SPEED = 1100;
    const COLORS = ['#ff4fa3', '#ff8a3d', '#ffd93d', '#7bf26b', '#2ee6d6', '#8b6cff'];

    let balls, sorted, dropped, dropCooldown, fullTimer, nextR;
    const impacts = [];                  // fast ball-vs-ball hits found this step, used for bouncing

    function chooseNextRadius() {
      // balls creep up in size as the game goes on, so the pit fills faster
      nextR = rand(10, 16) + Math.min(10, dropped / 20);
    }

    /** Drop a ball at x. Returns false if something is already sitting in the way. */
    function drop(x) {
      const r = nextR, bx = clamp(x, r, W - r), by = r + 6;
      for (const b of balls) {
        const dx = b.x - bx, dy = b.y - by, rs = b.r + r;
        if (dx * dx + dy * dy < rs * rs) return false;
      }
      const ball = { x: bx, y: by, px: bx, py: by, vx: rand(-40, 40), vy: 320, r, im: 1 / (r * r), hitX: 0, hitF: 0, color: pick(COLORS) };
      balls.push(ball); sorted.push(ball);
      dropped++;
      api.setScore(dropped);
      api.sound.play('drop');
      dropCooldown = Math.max(0.1, (2 * r + 6) / 380);   // bigger balls need a little more room between drops
      chooseNextRadius();
      return true;
    }

    function impact(speed) { if (speed > BOUNCE_MIN) api.sound.play('thud', speed); }

    /**
     * One physics step (position-based, which keeps big piles calm):
     *   1. apply gravity and move every ball
     *   2. push overlapping balls apart (a few passes) and keep them inside the walls
     *   3. work out each ball's velocity from how far it actually moved
     *   4. add bounce back in for fast impacts only
     */
    function physicsStep(h) {
      const drag = 1 - 0.3 * h;
      for (const b of balls) {
        b.px = b.x; b.py = b.y;
        b.vy += GRAVITY * h; b.vx *= drag; b.vy *= drag;
        b.x += b.vx * h; b.y += b.vy * h;
        b.hitX = 0; b.hitF = 0;
      }

      // keep `sorted` ordered by x (insertion sort: it's nearly sorted already, so this is cheap).
      // That lets the pair loop below stop early instead of checking every pair of balls.
      for (let i = 1; i < sorted.length; i++) {
        const k = sorted[i]; let j = i - 1;
        while (j >= 0 && sorted[j].x > k.x) { sorted[j + 1] = sorted[j]; j--; }
        sorted[j + 1] = k;
      }

      impacts.length = 0;
      for (let it = 0; it < ITERATIONS; it++) {
        for (const b of balls) {
          if (b.x < b.r)          { if (!b.hitX) b.hitX = b.vx; b.x = b.r; }
          else if (b.x > W - b.r) { if (!b.hitX) b.hitX = b.vx; b.x = W - b.r; }
          if (b.y > H - b.r)      { if (!b.hitF) b.hitF = b.vy; b.y = H - b.r; }
          if (b.y < b.r) b.y = b.r;                                  // a ceiling, so nothing flies out of view
        }
        for (let i = 0; i < sorted.length; i++) {
          const a = sorted[i];
          for (let j = i + 1; j < sorted.length; j++) {
            const c = sorted[j], rs = a.r + c.r, dx = c.x - a.x;
            if (dx > rs) break;                                        // everything further right is too far away
            const dy = c.y - a.y, d2 = dx * dx + dy * dy;
            if (d2 >= rs * rs) continue;
            let nx = 1, ny = 0, d = 0;
            if (d2 > 1e-8) { d = Math.sqrt(d2); nx = dx / d; ny = dy / d; }
            if (it === 0) {
              const vn = (c.vx - a.vx) * nx + (c.vy - a.vy) * ny;       // negative = moving toward each other
              if (vn < -BOUNCE_MIN) impacts.push({ a, c, nx, ny, vn });
            }
            const corr = (rs - d) / (a.im + c.im);                       // lighter balls get pushed further
            a.x -= nx * corr * a.im; a.y -= ny * corr * a.im;
            c.x += nx * corr * c.im; c.y += ny * corr * c.im;
          }
        }
      }
      for (const b of balls) {                                         // final hard stop at the walls
        b.x = clamp(b.x, b.r, W - b.r); b.y = clamp(b.y, b.r, H - b.r);
      }

      for (const b of balls) {
        b.vx = (b.x - b.px) / h; b.vy = (b.y - b.py) / h;
        const sp = Math.hypot(b.vx, b.vy);
        if (sp > MAX_SPEED) { b.vx *= MAX_SPEED / sp; b.vy *= MAX_SPEED / sp; }
        if (b.hitF > BOUNCE_MIN)        { b.vy = -b.hitF * E_WALL; impact(b.hitF); }
        if (Math.abs(b.hitX) > BOUNCE_MIN) { b.vx = -b.hitX * E_WALL; impact(Math.abs(b.hitX)); }
      }
      for (const { a, c, nx, ny, vn } of impacts) {
        const cur = (c.vx - a.vx) * nx + (c.vy - a.vy) * ny;
        const target = -E_BALL * vn;                                    // bounce back at a fraction of the impact speed
        if (cur < target) {
          const j = (target - cur) / (a.im + c.im);
          a.vx -= j * a.im * nx; a.vy -= j * a.im * ny;
          c.vx += j * c.im * nx; c.vy += j * c.im * ny;
          if (vn < -320) api.sound.play('tick');
        }
      }
    }

    // Buttons under the board (added once, when the game is created)
    api.addAction('Shake it 🫨', () => ballPit.shake());
    api.addAction('Done', () => api.end('All done!'));

    const ballPit = {
      reset() {
        balls = []; sorted = []; dropped = 0; dropCooldown = 0; fullTimer = 0;
        chooseNextRadius();
        api.setInfo('Pile 0%');
      },

      update(dt) {
        const ptr = api.input.ptr;
        dropCooldown -= dt;
        if (ptr.down && dropCooldown <= 0) drop(ptr.x);                // hold to pour

        for (let s = 0; s < SUBSTEPS; s++) physicsStep(dt / SUBSTEPS);

        // How high is the pile, and is a *resting* ball above the line?
        let top = H, tooHigh = false;
        for (const b of balls) {
          const slow = b.vx * b.vx + b.vy * b.vy < 2500;
          if (slow) top = Math.min(top, b.y - b.r);
          if (slow && b.y - b.r < LINE) tooHigh = true;
        }
        api.setInfo(`Pile ${Math.round(clamp((H - top) / (H - LINE), 0, 1) * 100)}%`);

        fullTimer = tooHigh ? fullTimer + dt : Math.max(0, fullTimer - dt * 2);
        if (fullTimer >= 2) api.end('The pit is full!');
      },

      pointerdown(p) { if (dropCooldown <= 0) drop(p.x); },            // a quick tap drops a ball right away

      draw(ctx) {
        // the "full" line: dashed, and it pulses red as the countdown runs
        const danger = clamp(fullTimer / 2, 0, 1);
        ctx.save();
        ctx.setLineDash([12, 10]);
        ctx.lineWidth = 3;
        ctx.strokeStyle = danger > 0 ? `rgba(255, 79, 109, ${0.55 + 0.45 * Math.sin(performance.now() / 70)})` : 'rgba(255, 79, 109, .45)';
        ctx.beginPath(); ctx.moveTo(0, LINE); ctx.lineTo(W, LINE); ctx.stroke();
        ctx.restore();
        label(ctx, 'keep the pile below this line', W - 10, LINE - 14, 15, 'rgba(255,255,255,.4)', 'right');

        // balls
        for (const b of balls) {
          ctx.fillStyle = b.color;
          ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,.35)';
          ctx.beginPath(); ctx.arc(b.x - b.r * 0.32, b.y - b.r * 0.32, b.r * 0.28, 0, Math.PI * 2); ctx.fill();
        }

        // ghost of the next ball under your mouse
        const ptr = api.input.ptr;
        if (ptr.inside) {
          ctx.globalAlpha = 0.35; ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.arc(clamp(ptr.x, nextR, W - nextR), nextR + 6, nextR, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = 1;
        }

        if (balls.length === 0) label(ctx, 'Click to drop a ball', W / 2, H / 2, 26, '#fff', 'center', 0.5);

        // countdown bar when the pile is too high
        if (danger > 0) {
          ctx.fillStyle = 'rgba(255, 79, 109, .9)';
          ctx.fillRect(0, LINE + 4, W * danger, 5);
        }
      },

      // used by the "Shake it" button
      shake() {
        for (const b of balls) { b.vx += rand(-450, 450); b.vy -= rand(250, 650); }
        api.sound.play('shake');
      },
    };
    return ballPit;
  },
});


/* --------------------------------------------------------------------------
   Snake
   Eat the apples, don't hit the walls or yourself. Every apple adds 10 points,
   makes you longer, and speeds the snake up a little.
   -------------------------------------------------------------------------- */
registerGame({
  id: 'snake',
  group: 'quick',
  name: 'Snake',
  emoji: '🐍',
  color: '#7bf26b',
  blurb: 'Eat, grow, and try not to crash.',
  help: 'Steer with the arrow keys or WASD. On a phone, swipe on the board or use the arrows below.',
  size: [480, 480],

  create(api) {
    const { W } = api;
    const N = 20, CELL = W / N;
    const DIRS = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
    const KEYS = { arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down', arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right' };
    const particles = makeParticles();

    let snake, dir, queue, food, acc, eaten, dead, t = 0, swipe = null;

    const interval = () => Math.max(0.07, 0.16 - eaten * 0.003);   // seconds per move: gets faster

    function turn(name) {
      const d = DIRS[name]; if (!d) return;
      const last = queue.length ? queue[queue.length - 1] : dir;
      if (d.x === last.x && d.y === last.y) return;                // already going that way
      if (d.x === -last.x && d.y === -last.y) return;              // no instant U-turns
      if (queue.length < 2) queue.push(d);                         // remember a quick double-tap
    }

    function placeFood() {
      const free = [];
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
      }
      food = free.length ? pick(free) : null;
    }

    function die(title) {
      if (dead) return;
      dead = true;
      api.sound.play('lose');
      particles.burst(snake[0].x * CELL + CELL / 2, snake[0].y * CELL + CELL / 2, '#7bf26b', 24, 260);
      api.end(title);
    }

    function step() {
      if (queue.length) dir = queue.shift();
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N) return die('Hit the wall!');

      const eating = food && head.x === food.x && head.y === food.y;
      const body = eating ? snake : snake.slice(0, -1);            // the tail moves out of the way unless we grow
      if (body.some(s => s.x === head.x && s.y === head.y)) return die('Ate yourself!');

      snake.unshift(head);
      if (eating) {
        eaten++;
        api.addScore(10);
        api.sound.play('eat');
        particles.burst(head.x * CELL + CELL / 2, head.y * CELL + CELL / 2, '#ff4f6d', 10);
        placeFood();
        if (!food) return die('You filled the board!');
      } else {
        snake.pop();
      }
      api.setInfo(`Length ${snake.length}`);
    }

    api.addDpad(turn);

    return {
      reset() {
        snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
        dir = DIRS.right; queue = []; eaten = 0; dead = false; swipe = null;
        acc = -0.4;                                                  // a short breather before the first move
        placeFood(); particles.clear();
        api.setInfo(`Length ${snake.length}`);
      },

      update(dt) {
        t += dt;
        particles.update(dt);
        acc += dt;
        while (acc >= interval() && !dead) { acc -= interval(); step(); }
      },

      idle(dt) { t += dt; particles.update(dt); },

      keydown(e, k) { if (KEYS[k]) turn(KEYS[k]); },

      // swipe: drag far enough in one direction and the snake turns that way
      pointerdown(p) { swipe = { x: p.x, y: p.y }; },
      pointermove(p) {
        if (!swipe || !api.input.ptr.down) return;
        const dx = p.x - swipe.x, dy = p.y - swipe.y;
        if (Math.hypot(dx, dy) < 22) return;
        turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
        swipe = { x: p.x, y: p.y };
      },
      pointerup() { swipe = null; },

      draw(ctx) {
        // checkerboard
        for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
          ctx.fillStyle = (x + y) % 2 ? '#1b1239' : '#170f31';
          ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
        }
        // apple
        if (food) {
          const fx = food.x * CELL + CELL / 2, fy = food.y * CELL + CELL / 2;
          const r = CELL * 0.36 * (1 + Math.sin(t * 6) * 0.08);
          ctx.fillStyle = '#ff4f6d'; ctx.beginPath(); ctx.arc(fx, fy + 1, r, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.beginPath(); ctx.arc(fx - r * 0.35, fy - r * 0.2, r * 0.25, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#7bf26b'; ctx.fillRect(fx - 1, fy - r - 5, 3, 6);
        }
        // snake, tail first so the head sits on top
        for (let i = snake.length - 1; i >= 0; i--) {
          const s = snake[i], pad = i === 0 ? 1.5 : 2.5;
          ctx.fillStyle = i === 0 ? '#b9ff8a' : `hsl(${125 + (i * 3) % 40}, 75%, ${56 - Math.min(i, 24) * 0.7}%)`;
          rr(ctx, s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 7); ctx.fill();
        }
        // eyes look where the snake is heading
        const h = snake[0], cx = h.x * CELL + CELL / 2, cy = h.y * CELL + CELL / 2;
        const px = -dir.y, py = dir.x;                               // sideways vector
        for (const side of [-1, 1]) {
          const ex = cx + dir.x * 4 + px * side * 5, ey = cy + dir.y * 4 + py * side * 5;
          ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, ey, 3.4, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#150d2b'; ctx.beginPath(); ctx.arc(ex + dir.x * 1.2, ey + dir.y * 1.2, 1.7, 0, Math.PI * 2); ctx.fill();
        }
        particles.draw(ctx);
      },
    };
  },
});


/* --------------------------------------------------------------------------
   Pong
   Paddles at the top and bottom of a portrait court. First to 7 points wins.
   1 player: every match you win scores 1 and the next computer opponent is
   faster and sharper. 2 players: Player 1 (bottom) and Player 2 (top).
   -------------------------------------------------------------------------- */
registerGame({
  id: 'pong',
  group: 'balls',
  name: 'Pong',
  emoji: '🏓',
  color: '#8b6cff',
  players: 'both',
  p1Color: '#ffd93d',
  p2Color: '#2ee6d6',
  blurb: 'The original paddle duel. Play the computer or a friend.',
  help: 'First to 7 points wins. 1 player: move with the mouse, your finger, or ← → (A D). Each match you win scores 1, and the next opponent is faster. 2 players: Player 1 uses A and D (or drags the bottom half), Player 2 uses ← and → (or drags the top half).',
  size: [480, 640],

  create(api) {
    const { W, H } = api;
    const PH = 14, R = 8, WIN = 7, MARGIN = 46;
    const P1 = 0, P2 = 1;                                   // P1 = bottom paddle, P2 = top paddle (or the computer)
    const paddles = [{ x: W / 2, y: H - MARGIN, w: 96 }, { x: W / 2, y: MARGIN, w: 96 }];
    const owner = new Map();                                // pointerId -> paddle index (2-player touch)
    const trail = [];
    let ball, pts, serveT, serveDir, rally, match, banner, aiNoise;

    const solo = () => api.mode === '1p';
    const aiSpeed = () => Math.min(540, 195 + 48 * (match - 1));      // the first opponent is slow and sloppy; each match is quicker and sharper
    const aiError = () => Math.max(0, 64 - 10 * (match - 1));
    const ballSpeed = () => Math.min(780, 340 + rally * 16 + (solo() ? (match - 1) * 15 : 0));
    const setX = (i, x) => { paddles[i].x = clamp(x, paddles[i].w / 2, W - paddles[i].w / 2); };

    function updateInfo() { api.setInfo(solo() ? `Match ${match}   You ${pts[0]} to ${pts[1]} computer` : ''); }

    function startServe() {
      ball = { x: W / 2, y: H / 2, vx: 0, vy: 0 };
      serveT = 0.9; rally = 0; trail.length = 0;
      aiNoise = rand(-1, 1) * aiError();
    }

    function launch() {
      const a = rand(-0.5, 0.5), s = ballSpeed();
      ball.vx = Math.sin(a) * s; ball.vy = serveDir * Math.cos(a) * s;
    }

    function point(i) {
      pts[i]++;
      api.setScores(pts[0], pts[1]);
      api.sound.play(solo() && i === P2 ? 'lose' : 'goal');
      serveDir = i === P1 ? -1 : 1;                         // serve toward whoever just lost the point
      if (pts[i] >= WIN) {
        if (!solo()) { api.endMatch(i === P1 ? 1 : 2, `Final score ${pts[0]} to ${pts[1]}`); return; }
        if (i === P2) { api.end('The computer wins'); return; }
        api.addScore(1);                                    // you won the match: bring on a tougher opponent
        match++; pts = [0, 0];
        paddles[P1].w = Math.max(64, 96 - 4 * (match - 1));
        setX(P1, paddles[P1].x);
        api.setScores(0, 0);
        banner = { text: `Match ${match}`, t: 1.6 };
        api.sound.play('levelup');
      }
      updateInfo();
      startServe();
    }

    function hitPaddle(i) {
      const p = paddles[i];
      if (i === P1 ? ball.vy <= 0 : ball.vy >= 0) return;   // only when the ball is moving toward this paddle
      const front = i === P1 ? p.y - PH / 2 : p.y + PH / 2;
      const reached = i === P1 ? (ball.y + R >= front && ball.y < p.y) : (ball.y - R <= front && ball.y > p.y);
      if (!reached || Math.abs(ball.x - p.x) > p.w / 2 + R) return;
      const off = clamp((ball.x - p.x) / (p.w / 2), -1, 1); // where it landed decides the angle
      rally++;
      const s = ballSpeed(), a = off * 1.0;
      ball.vx = Math.sin(a) * s; ball.vy = (i === P1 ? -1 : 1) * Math.cos(a) * s;
      ball.y = i === P1 ? front - R : front + R;
      api.sound.play('paddle');
      if (i === P1) aiNoise = rand(-1, 1) * aiError();      // the computer picks a fresh aiming error
    }

    function aiStep(dt) {
      const p = paddles[P2];
      const target = (serveT <= 0 && ball.vy < 0) ? ball.x + aiNoise : W / 2;
      const step = aiSpeed() * dt;
      setX(P2, p.x + clamp(target - p.x, -step, step));
    }

    const game = {
      reset() {
        pts = [0, 0]; match = 1; banner = null; owner.clear();
        paddles.forEach(p => { p.w = 96; p.x = W / 2; });
        serveDir = Math.random() < 0.5 ? 1 : -1;
        startServe();
        api.setScores(0, 0);
        updateInfo();
      },

      update(dt) {
        const k = api.input.keys, move = (i, l, r) => { const d = (r ? 1 : 0) - (l ? 1 : 0); if (d) setX(i, paddles[i].x + d * 540 * dt); };
        if (solo()) { move(P1, k.has('a') || k.has('arrowleft'), k.has('d') || k.has('arrowright')); aiStep(dt); }
        else { move(P1, k.has('a'), k.has('d')); move(P2, k.has('arrowleft'), k.has('arrowright')); }
        if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }

        if (serveT > 0) { serveT -= dt; if (serveT <= 0) launch(); return; }

        const sp = Math.hypot(ball.vx, ball.vy), steps = Math.max(1, Math.ceil(sp * dt / 5)), h = dt / steps;
        for (let i = 0; i < steps; i++) {
          ball.x += ball.vx * h; ball.y += ball.vy * h;
          if (ball.x < R)         { ball.x = R;     ball.vx =  Math.abs(ball.vx); api.sound.play('wall'); }
          else if (ball.x > W - R) { ball.x = W - R; ball.vx = -Math.abs(ball.vx); api.sound.play('wall'); }
          hitPaddle(P1); hitPaddle(P2);
          if (ball.y > H + R * 2) { point(P2); return; }
          if (ball.y < -R * 2)    { point(P1); return; }
        }
        trail.push({ x: ball.x, y: ball.y }); if (trail.length > 8) trail.shift();
      },

      pointerdown(p, e) {
        if (solo()) setX(P1, p.x);
        else { const i = p.y > H / 2 ? P1 : P2; owner.set(e.pointerId, i); setX(i, p.x); }
      },
      pointermove(p, e) {
        if (solo()) setX(P1, p.x);
        else if (owner.has(e.pointerId)) setX(owner.get(e.pointerId), p.x);
      },
      pointerup(p, e) { owner.delete(e.pointerId); },

      draw(ctx) {
        ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 3; ctx.setLineDash([14, 12]);
        ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke(); ctx.setLineDash([]);
        label(ctx, pts[P2], W - 46, H / 2 - 52, 70, 'rgba(255,255,255,.12)');
        label(ctx, pts[P1], W - 46, H / 2 + 52, 70, 'rgba(255,255,255,.12)');

        trail.forEach((t, i) => { ctx.globalAlpha = (i + 1) / trail.length * 0.3; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(t.x, t.y, R * (0.4 + i / 14), 0, Math.PI * 2); ctx.fill(); });
        ctx.globalAlpha = 1;

        [[paddles[P1], '#ffd93d'], [paddles[P2], '#2ee6d6']].forEach(([p, col]) => {
          ctx.shadowColor = col; ctx.shadowBlur = 14; ctx.fillStyle = col;
          rr(ctx, p.x - p.w / 2, p.y - PH / 2, p.w, PH, 7); ctx.fill();
        });
        ctx.shadowColor = '#fff'; ctx.shadowBlur = 12; ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(ball.x, ball.y, R, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;

        if (serveT > 0) label(ctx, 'Get ready', W / 2, H / 2 + 90, 26, '#fff', 'center', 0.7);
        if (banner) label(ctx, banner.text, W / 2, H / 2 - 90, 48, '#ffd93d', 'center', clamp(banner.t, 0, 1));
        if (api.mode === '2p') {                              // who's who, written the right way up for each player
          label(ctx, 'Player 2', W / 2, 18, 15, 'rgba(46,230,214,.7)');
          label(ctx, 'Player 1', W / 2, H - 16, 15, 'rgba(255,217,61,.7)');
        }
      },
    };
    return game;
  },
});


/* --------------------------------------------------------------------------
   Bounce Keeper
   Keep the ball in the air. Every bounce launches it a little higher and pulls
   it down a little harder, and the paddle slowly shrinks. Hit the middle of the
   paddle for a "perfect" (2 points).
   -------------------------------------------------------------------------- */
registerGame({
  id: 'bounce-keeper',
  group: 'balls',
  name: 'Bounce Keeper',
  emoji: '🏀',
  color: '#ff4fa3',
  blurb: 'Keep the ball up. It gets faster every bounce.',
  help: 'Move the paddle with your mouse, your finger, or ← → (A D). Catch the ball in the middle of the paddle for a perfect bounce.',
  size: [480, 640],

  create(api) {
    const { W, H } = api;
    const R = 12, PH = 14, PY = H - 50;
    const paddle = { x: W / 2, w: 120 };
    const particles = makeParticles();
    let ball, hits, delay, texts;

    const gravity = () => Math.min(3200, 1300 + 55 * hits);       // pulls harder as you go…
    const kick = () => Math.min(1250, 800 + 12 * hits);           // …and each bounce launches it higher
    const setX = x => { paddle.x = clamp(x, paddle.w / 2, W - paddle.w / 2); };

    function bounce() {
      const off = clamp((ball.x - paddle.x) / (paddle.w / 2), -1, 1);
      const perfect = Math.abs(off) < 0.18;
      ball.vy = -kick();
      ball.vx = off * Math.min(560, 240 + 8 * hits) + ball.vx * 0.15;
      ball.y = PY - PH / 2 - R;
      hits++;
      api.addScore(perfect ? 2 : 1);
      api.sound.play(perfect ? 'gold' : 'paddle');
      particles.burst(ball.x, PY, perfect ? '#ffd93d' : '#ff4fa3', perfect ? 14 : 6, 160);
      if (perfect) texts.push({ text: 'Perfect!', x: ball.x, y: PY - 40, t: 0.8 });
      paddle.w = Math.max(70, 120 - hits * 1.0);
      setX(paddle.x);
      api.setInfo(`Level ${1 + Math.floor(hits / 10)}`);
    }

    const game = {
      reset() {
        hits = 0; paddle.w = 120; delay = 0.7; texts = [];
        setX(api.input.ptr.inside ? api.input.ptr.x : W / 2);
        ball = { x: rand(140, W - 140), y: 110, vx: rand(-80, 80), vy: 0 };
        particles.clear();
        api.setInfo('Level 1');
      },

      update(dt) {
        const k = api.input.keys;
        const d = (k.has('arrowright') || k.has('d') ? 1 : 0) - (k.has('arrowleft') || k.has('a') ? 1 : 0);
        if (d) setX(paddle.x + d * 600 * dt);
        particles.update(dt);
        texts.forEach(t => { t.t -= dt; t.y -= 30 * dt; }); texts = texts.filter(t => t.t > 0);
        if (delay > 0) { delay -= dt; return; }

        const steps = Math.max(1, Math.ceil(Math.abs(ball.vy) * dt / 6)), h = dt / steps;
        for (let i = 0; i < steps; i++) {
          ball.vy += gravity() * h;
          ball.x += ball.vx * h; ball.y += ball.vy * h;
          if (ball.x < R)          { ball.x = R;     ball.vx =  Math.abs(ball.vx); api.sound.play('wall'); }
          else if (ball.x > W - R) { ball.x = W - R; ball.vx = -Math.abs(ball.vx); api.sound.play('wall'); }
          if (ball.y < R)          { ball.y = R;     ball.vy =  Math.abs(ball.vy) * 0.6; }
          if (ball.vy > 0 && ball.y + R >= PY - PH / 2 && ball.y < PY && Math.abs(ball.x - paddle.x) <= paddle.w / 2 + R * 0.6) bounce();
          if (ball.y - R > H) { api.sound.play('lose'); api.end('You dropped it!'); return; }
        }
      },

      idle(dt) { particles.update(dt); },
      pointerdown(p) { setX(p.x); },
      pointermove(p) { setX(p.x); },

      draw(ctx) {
        // a faint tower of guide lines under the ball, and its shadow on the paddle line
        ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 2; ctx.setLineDash([6, 10]);
        ctx.beginPath(); ctx.moveTo(ball.x, ball.y); ctx.lineTo(ball.x, PY); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(ball.x, PY + 12, R * (1.1 - clamp((PY - ball.y) / 700, 0, 0.7)), 4, 0, 0, Math.PI * 2); ctx.fill();

        ctx.shadowColor = '#ff4fa3'; ctx.shadowBlur = 14; ctx.fillStyle = '#ff9ccb';
        rr(ctx, paddle.x - paddle.w / 2, PY - PH / 2, paddle.w, PH, 7); ctx.fill();
        ctx.fillStyle = '#ffd93d'; rr(ctx, paddle.x - 10, PY - PH / 2, 20, PH, 5); ctx.fill();   // the "perfect" zone
        ctx.shadowBlur = 0;

        const g = ctx.createRadialGradient(ball.x - 4, ball.y - 4, 2, ball.x, ball.y, R);
        g.addColorStop(0, '#fff'); g.addColorStop(1, '#ff4fa3');
        ctx.fillStyle = g; ctx.shadowColor = '#ff4fa3'; ctx.shadowBlur = 16;
        ctx.beginPath(); ctx.arc(ball.x, ball.y, R, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;

        particles.draw(ctx);
        texts.forEach(t => label(ctx, t.text, t.x, t.y, 24, '#ffd93d', 'center', clamp(t.t * 2, 0, 1)));
        if (delay > 0) label(ctx, 'Get ready', W / 2, H / 2, 28, '#fff', 'center', 0.6);
      },
    };
    return game;
  },
});


/* --------------------------------------------------------------------------
   Plinko
   Drop 10 balls through the pegs. Tap where you want to drop (or press and
   slide to aim, then let go). The big prizes are in the corner slots, which are
   the hardest to reach, and the balls get bigger as you go.
   -------------------------------------------------------------------------- */
registerGame({
  id: 'plinko',
  group: 'balls',
  name: 'Plinko',
  emoji: '🔻',
  color: '#ffd93d',
  blurb: 'Drop 10 balls and chase the corner jackpots.',
  help: 'Tap or click along the top to drop a ball. On a phone you can press and slide to aim, then let go. You get 10 balls, and the balls grow as you play.',
  size: [480, 640],

  create(api) {
    const { W, H } = api;
    const SLOT_W = 60, SLOTS = 8, SLOT_TOP = H - 90, TOTAL = 10;
    const VALUES = [100, 30, 10, 5, 5, 10, 30, 100];
    const SLOT_COLORS = ['#ffd93d', '#ff8a3d', '#ff4fa3', '#8b6cff', '#8b6cff', '#ff4fa3', '#ff8a3d', '#ffd93d'];
    const PEG_R = 6, GRAVITY = 1100, E = 0.5;
    const pegs = [];
    for (let row = 0; row < 9; row++) {
      const y = 140 + row * 44, odd = row % 2 === 1;
      const count = odd ? SLOTS - 1 : SLOTS;
      for (let i = 0; i < count; i++) pegs.push({ x: (odd ? SLOT_W : SLOT_W / 2) + i * SLOT_W, y });
    }
    const particles = makeParticles();
    let balls, left, aim, aiming, lastDrop, popups, finishT;

    const radius = n => 8 + 0.4 * n;                              // balls grow from 8 to ~11.6

    function drop(x) {
      if (left <= 0 || performance.now() - lastDrop < 300) return;
      const r = radius(TOTAL - left);
      balls.push({ x: clamp(x, r, W - r), y: 46, vx: rand(-10, 10), vy: 0, r, slow: 0, done: false, fade: 1 });
      left--; lastDrop = performance.now();
      api.sound.play('drop');
      api.setInfo(`Balls left ${left}`);
    }

    function stepBall(b, h) {
      b.vy += GRAVITY * h;
      b.x += b.vx * h; b.y += b.vy * h;
      if (b.x < b.r)          { b.x = b.r;     b.vx =  Math.abs(b.vx) * E; }
      else if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx) * E; }
      for (const p of pegs) {
        const dx = b.x - p.x, dy = b.y - p.y, rs = b.r + PEG_R;
        if (dx * dx + dy * dy >= rs * rs) continue;
