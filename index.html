    const SKIN = ['#ffd2a8', '#d9a073'];
    const particles = makeParticles();
    const mk = i => ({ i, dir: i === 0 ? 1 : -1, x: 0, y: STAND, vx: 0, vy: 0, kickT: 0, cool: 0, foot: { x: 0, y: 0, vx: 0, vy: 0 } });
    const pl = [mk(0), mk(1)];
    const ai = { t: 0, react: 0.3, err: 60, speed: 200, seen: { x: W / 2, y: 0, vx: 0, vy: 0 } };
    const latch = [{ j: false, k: false }, { j: false, k: false }];   // jump/kick presses remembered until the next frame, so a very quick tap is never missed
    let ball, goals, clock, golden, st, stT, banner, match, pad, intents;

    const solo = () => api.mode === '1p';

    /* ---------- touch buttons (rebuilt per mode: 1 player gets bigger, thumb-friendly ones) ---------- */
    function buttonsFor(mode) {
      const y = 480, h = 90, B = (id, x, w, label, color, flip) => ({ id, x, y, w, h, label, color });
      if (mode === '1p') return [B('p1l', 14, 96, '◀', COL[0]), B('p1r', 118, 96, '▶', COL[0]), B('p1j', 590, 96, '▲', COL[0]), B('p1k', 694, 92, '⚽', COL[0])];
      return [
        B('p1l', 14, 88, '◀', COL[0]), B('p1r', 108, 88, '▶', COL[0]), B('p1j', 202, 88, '▲', COL[0]), B('p1k', 296, 88, '⚽', COL[0]),
        B('p2l', 416, 88, '◀', COL[1]), B('p2r', 510, 88, '▶', COL[1]), B('p2j', 604, 88, '▲', COL[1]), B('p2k', 698, 88, '⚽', COL[1]),
      ];
    }

    /* ---------- the computer opponent ---------- */
    function aiThink(dt) {
      const p = pl[1];
      ai.t -= dt;
      if (ai.t <= 0) {                                               // it only "sees" the ball every so often, and a bit wrongly
        ai.t = ai.react;
        ai.seen = { x: ball.x + rand(-1, 1) * ai.err, y: ball.y, vx: ball.vx, vy: ball.vy };
      }
      const b = ai.seen;
      const chase = b.x > W / 2 - 50 || b.vx > 150;                  // go for it when it's on, or heading to, our half
      const inFront = ball.x < p.x - 16;                             // ball is between me and the player's goal: I can kick it away
      let target = chase ? clamp(b.x + b.vx * 0.2 + 44, MINX, MAXX) : W - 160;   // stand just behind the ball so a kick sends it left
      // Never run INTO a ball that is in front of us from the left (that would push it toward our own goal): hold position and let it come
      if (inFront && chase && target > p.x) target = p.x;
      const behindBall = !inFront && ball.x > p.x + 8;               // ball slipped behind us: hop over it instead of shoving it into our goal
      if (behindBall) target = Math.min(MAXX, ball.x + 80);
      const dx = target - p.x;
      const bd = Math.hypot(ball.x - p.x, ball.y - p.y);
      return {
        l: dx < -14, r: dx > 14,
        j: p.y >= STAND - 1 && ((chase && b.y < GROUND - 130 && Math.abs(b.x - p.x) < 70 && b.vy > -150) || (behindBall && Math.abs(ball.x - p.x) < 100)),
        k: bd < 104 && ball.x < p.x + 12,
      };
    }

    /* ---------- reading controls ---------- */
    function readIntents(dt) {
      const k = api.input.keys, any = (...names) => names.some(n => k.has(n));
      const T = (i, id) => pad.pressed(id) || latch[i][id.endsWith('j') ? 'j' : 'k'];
      if (solo()) {
        intents = [{
          l: any('a', 'arrowleft') || pad.isDown('p1l'), r: any('d', 'arrowright') || pad.isDown('p1r'),
          j: any('w', 'arrowup') || pad.isDown('p1j') || T(0, 'p1j'), k: any('s', 'arrowdown', ' ', 'enter') || pad.isDown('p1k') || T(0, 'p1k'),
        }, aiThink(dt)];
      } else {
        intents = [
          { l: any('a') || pad.isDown('p1l'), r: any('d') || pad.isDown('p1r'), j: any('w') || pad.isDown('p1j') || T(0, 'p1j'), k: any('s', ' ') || pad.isDown('p1k') || T(0, 'p1k') },
          { l: any('arrowleft') || pad.isDown('p2l'), r: any('arrowright') || pad.isDown('p2r'), j: any('arrowup') || pad.isDown('p2j') || T(1, 'p2j'), k: any('arrowdown', 'enter') || pad.isDown('p2k') || T(1, 'p2k') },
        ];
      }
      latch.forEach(l => { l.j = l.k = false; });
    }

    /* ---------- geometry ---------- */
    const phi = p => p.kickT > 0 ? 0.5 + 1.55 * Math.sin(Math.PI * (1 - p.kickT / KICK_T)) : 0.5;   // leg angle: swings forward and back
    function footTarget(p) {
      const a = phi(p);
      return { x: p.x + p.dir * Math.sin(a) * LEG, y: Math.min(p.y + Math.cos(a) * LEG, GROUND - FR) };
    }

    function resetPositions() {
      pl[0].x = 230; pl[1].x = W - 230;
      pl.forEach(p => { p.y = STAND; p.vx = p.vy = 0; p.kickT = 0; p.cool = 0; const f = footTarget(p); p.foot = { x: f.x, y: f.y, vx: 0, vy: 0 }; });
      ball = { x: W / 2, y: 150, vx: 0, vy: 0, rot: 0 };
    }

    function kickoff() { resetPositions(); st = 'kickoff'; stT = 1.1; banner = null; }

    function updateInfo() { api.setInfo(solo() ? `Match ${match}` : ''); }

    /* ---------- ball vs a circle (a head or a foot); the circle is much heavier than the ball ---------- */
    function hitCircle(cx, cy, cr, cvx, cvy, e) {
      let dx = ball.x - cx, dy = ball.y - cy, d = Math.hypot(dx, dy);
      const min = BR + cr;
      if (d >= min) return false;
      if (d < 0.001) { dx = 0; dy = -1; d = 1; }
      const nx = dx / d, ny = dy / d;
      ball.x = cx + nx * min; ball.y = cy + ny * min;                // push the ball out
      const rel = (ball.vx - cvx) * nx + (ball.vy - cvy) * ny;       // closing speed
      if (rel < 0) { ball.vx -= (1 + e) * rel * nx; ball.vy -= (1 + e) * rel * ny; }
      return true;
    }
    function hitRect(rx, ry, rw, rh, e) {                            // the crossbars
      const cx = clamp(ball.x, rx, rx + rw), cy = clamp(ball.y, ry, ry + rh);
      let dx = ball.x - cx, dy = ball.y - cy, d = Math.hypot(dx, dy);
      if (d >= BR) return;
      if (d < 0.001) { dx = 0; dy = -1; d = 1; }
      const nx = dx / d, ny = dy / d;
      ball.x = cx + nx * BR; ball.y = cy + ny * BR;
      const vn = ball.vx * nx + ball.vy * ny;
      if (vn < 0) { ball.vx -= (1 + e) * vn * nx; ball.vy -= (1 + e) * vn * ny; api.sound.play('tink'); }
    }

    function scored(i) {
      goals[i]++; api.setScores(goals[0], goals[1]);
      api.sound.play('goal');
      particles.burst(i === 0 ? W - 40 : 40, GROUND - 60, COL[i], 40, 380);
      banner = golden ? 'GOLDEN GOAL!' : 'GOAL!';
      const decided = golden || goals[i] >= WIN_GOALS;
      st = 'goal'; stT = 1.7;
      if (decided) finish(i);
    }

    function finish(winner) {                                        // winner 0/1 (player index)
      if (!solo()) { st = 'over'; api.endMatch(winner + 1, `Final score ${goals[0]} to ${goals[1]}`); return; }
      if (winner === 1) { st = 'over'; api.end('The computer wins'); return; }
      api.addScore(1);                                               // you won the match: face a tougher opponent
      match++;
      ai.speed = Math.min(380, 200 + 26 * (match - 1)); ai.react = Math.max(0.05, 0.3 - 0.045 * (match - 1)); ai.err = Math.max(4, 60 - 9 * (match - 1));
      goals = [0, 0]; api.setScores(0, 0); clock = MATCH_TIME; golden = false;
      updateInfo();
      api.sound.play('levelup');
      st = 'goal'; stT = 1.7; banner = `Match ${match}`;
    }

    /* ---------- one frame of physics ---------- */
    function step(dt) {
      readIntents(dt);
      const speed = [RUN, solo() ? ai.speed : RUN];
      pl.forEach((p, i) => {
        const it = intents[i];
        p.vx = ((it.r ? 1 : 0) - (it.l ? 1 : 0)) * speed[i];
        if (it.j && p.y >= STAND - 1) { p.vy = -JUMP; api.sound.play('tick'); }
        p.cool = Math.max(0, p.cool - dt);
        if (it.k && p.kickT <= 0 && p.cool <= 0) { p.kickT = KICK_T; p.cool = KICK_T + 0.1; api.sound.play('kick'); }
        p.kickT = Math.max(0, p.kickT - dt);
      });

      const h = dt / SUB;
      for (let s = 0; s < SUB; s++) {
        pl.forEach(p => {
          p.x = clamp(p.x + p.vx * h, MINX, MAXX);
          p.vy += GRAV_P * h; p.y += p.vy * h;
          if (p.y >= STAND) { p.y = STAND; p.vy = 0; }
          const f = footTarget(p);
          p.foot.vx = (f.x - p.foot.x) / h; p.foot.vy = (f.y - p.foot.y) / h; p.foot.x = f.x; p.foot.y = f.y;
        });
        // the two heads can't walk through each other
        const a = pl[0], b = pl[1], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
        if (d < HR * 2 && d > 0.001) {
          const push = (HR * 2 - d) / 2, nx = dx / d, ny = dy / d;
          a.x = clamp(a.x - nx * push, MINX, MAXX); b.x = clamp(b.x + nx * push, MINX, MAXX);
          if (ny > 0.3) a.y = Math.min(STAND, a.y - ny * push); else if (ny < -0.3) b.y = Math.min(STAND, b.y + ny * push);
        }
        if (st === 'kickoff') continue;                              // ball waits in the air until the whistle

        ball.vy += GRAV_B * h;
        ball.x += ball.vx * h; ball.y += ball.vy * h;
        ball.rot += ball.vx * h / BR;
        // ground
        if (ball.y > GROUND - BR) {
          ball.y = GROUND - BR;
          if (ball.vy > 0) { if (ball.vy > 160) api.sound.play('thud', ball.vy); ball.vy = ball.vy > 110 ? -ball.vy * 0.72 : 0; }
          ball.vx *= Math.exp(-0.7 * h);                              // rolling friction
        }
        if (ball.y < BR) { ball.y = BR; ball.vy = Math.abs(ball.vy) * 0.8; }
        // side walls (only above the goals; below the bars the ball is in the net)
        const barTop = GROUND - GH - 10;
        if (ball.x < BR && ball.y < barTop)     { ball.x = BR;     ball.vx =  Math.abs(ball.vx) * 0.8; api.sound.play('wall'); }
        if (ball.x > W - BR && ball.y < barTop) { ball.x = W - BR; ball.vx = -Math.abs(ball.vx) * 0.8; api.sound.play('wall'); }
        if (ball.x < BR)     { ball.x = BR;     ball.vx = Math.abs(ball.vx) * 0.3; }          // back of the net
        if (ball.x > W - BR) { ball.x = W - BR; ball.vx = -Math.abs(ball.vx) * 0.3; }
        hitRect(0, barTop, GW, 10, 0.7); hitRect(W - GW, barTop, GW, 10, 0.7);
        if (st === 'play') {
          // players: heads bump, feet kick
          for (const p of pl) {
            if (hitCircle(p.x, p.y, HR, p.vx, p.vy, 0.8)) api.sound.play('paddle');
            const kicking = p.kickT > 0 && p.kickT > KICK_T * 0.25;
            if (hitCircle(p.foot.x, p.foot.y, FR, p.foot.vx, p.foot.vy, kicking ? 1.15 : 0.55)) api.sound.play('kick');
          }
        }
        const sp = Math.hypot(ball.vx, ball.vy);
        if (sp > MAX_BALL) { ball.vx *= MAX_BALL / sp; ball.vy *= MAX_BALL / sp; }
        // goals: the ball is inside the net, below the crossbar
        if (st === 'play' && ball.y > GROUND - GH) {
          if (ball.x < GW - 8)     { scored(1); continue; }
          if (ball.x > W - GW + 8) { scored(0); continue; }
        }
      }
    }

    const game = {
      reset() {
        goals = [0, 0]; match = 1; golden = false; clock = MATCH_TIME; banner = null; intents = [{}, {}];
        ai.speed = 200; ai.react = 0.3; ai.err = 60; ai.t = 0;
        pad = makeTouchPad(api, buttonsFor(api.mode));
        particles.clear(); api.setScores(0, 0); updateInfo();
        kickoff();
      },

      update(dt) {
        particles.update(dt);
        if (st === 'kickoff') { stT -= dt; if (stT <= 0) { st = 'play'; api.sound.play('go'); } }
        else if (st === 'goal') { stT -= dt; if (stT <= 0 && st === 'goal') kickoff(); }
        else if (st === 'play') {
          if (!golden) {
            clock -= dt;
            if (clock <= 0) {
              clock = 0;
              if (goals[0] !== goals[1]) { finish(goals[0] > goals[1] ? 0 : 1); return; }
              golden = true; banner = 'Golden goal!'; stT = 0;                       // sudden death
            }
          }
        }
        step(dt);
        if (banner && st === 'play' && !golden) banner = null;
      },
      idle(dt) { particles.update(dt); },

      pointerdown(p, e) { pad.down(p, e); },
      pointermove(p, e) { pad.move(p, e); },
      pointerup(p, e) { pad.up(p, e); },
      keydown(e, k) {                                                   // remember quick taps of jump / kick
        if (solo()) { if (k === 'w' || k === 'arrowup') latch[0].j = true; if (['s', 'arrowdown', ' ', 'enter'].includes(k)) latch[0].k = true; }
        else {
          if (k === 'w') latch[0].j = true; if (k === 's' || k === ' ') latch[0].k = true;
          if (k === 'arrowup') latch[1].j = true; if (k === 'arrowdown' || k === 'enter') latch[1].k = true;
        }
      },

      draw(ctx) {
        // night sky + stands
        const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
        sky.addColorStop(0, '#1a1040'); sky.addColorStop(1, '#3a2380');
        ctx.fillStyle = sky; ctx.fillRect(0, 0, W, PITCH);
        for (let r = 0; r < 4; r++) for (let x = 0; x < W; x += 22) {          // little crowd dots
          ctx.fillStyle = ['#ff4f6d', '#ffd93d', '#2ee6d6', '#8b6cff'][(x / 22 + r) % 4 | 0]; ctx.globalAlpha = 0.28;
          ctx.beginPath(); ctx.arc(x + (r % 2) * 11 + 8, 190 + r * 24, 6, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
        // grass with stripes
        for (let i = 0; i < 10; i++) { ctx.fillStyle = i % 2 ? '#1b8a4c' : '#1f9955'; ctx.fillRect(i * W / 10, GROUND, W / 10 + 1, PITCH - GROUND); }
        ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(0, GROUND - 1, W, 3);
        ctx.fillRect(W / 2 - 1, GROUND + 4, 3, PITCH - GROUND - 4);
        // goals
        for (const left of [true, false]) {
          const x0 = left ? 0 : W - GW, y0 = GROUND - GH;
          ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 1;
          for (let x = 0; x <= GW; x += 12) { ctx.beginPath(); ctx.moveTo(x0 + x, y0); ctx.lineTo(x0 + x, GROUND); ctx.stroke(); }
          for (let y = 0; y <= GH; y += 12) { ctx.beginPath(); ctx.moveTo(x0, y0 + y); ctx.lineTo(x0 + GW, y0 + y); ctx.stroke(); }
          ctx.fillStyle = '#fff'; ctx.fillRect(x0, y0 - 10, GW, 10);
          ctx.fillRect(left ? GW - 4 : W - GW, y0 - 10, 4, GH + 10);
        }
        // players
        pl.forEach((p, i) => {
          ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(p.x, GROUND + 5, 40, 8, 0, 0, Math.PI * 2); ctx.fill();
          // leg + shoe
          ctx.strokeStyle = '#2a2145'; ctx.lineWidth = 9; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(p.x, p.y + HR * 0.7); ctx.lineTo(p.foot.x, p.foot.y); ctx.stroke();
          ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.foot.x, p.foot.y, FR, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = COL[i]; ctx.beginPath(); ctx.arc(p.foot.x + p.dir * 3, p.foot.y - 1, FR * 0.55, 0, Math.PI * 2); ctx.fill();
          // jersey, head, hair
          ctx.fillStyle = COL[i]; rr(ctx, p.x - 20, p.y + HR * 0.55, 40, 24, 10); ctx.fill();
          ctx.fillStyle = SKIN[i]; ctx.beginPath(); ctx.arc(p.x, p.y, HR, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = COL[i]; ctx.beginPath(); ctx.arc(p.x, p.y, HR, Math.PI * 1.08, Math.PI * 1.92); ctx.closePath(); ctx.fill();   // headband / hair
          // eyes follow the ball
          const ax = ball.x - p.x, ay = ball.y - p.y, ad = Math.hypot(ax, ay) || 1;
          for (const ex of [-0.34, 0.34]) {
            const gx = p.x + p.dir * 6 + ex * HR * 0.9, gy = p.y - 2;
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(gx, gy, 9, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#150d2b'; ctx.beginPath(); ctx.arc(gx + ax / ad * 3.5, gy + ay / ad * 3.5, 4.2, 0, Math.PI * 2); ctx.fill();
          }
          // mouth: grins when its team just scored, otherwise a small line
          ctx.strokeStyle = '#150d2b'; ctx.lineWidth = 3; ctx.beginPath();
          if (st === 'goal' && banner && goals[i] > goals[1 - i]) ctx.arc(p.x + p.dir * 6, p.y + 12, 9, 0.1, Math.PI - 0.1);
          else { ctx.moveTo(p.x + p.dir * 6 - 8, p.y + 17); ctx.lineTo(p.x + p.dir * 6 + 8, p.y + 17); }
          ctx.stroke();
        });
        // ball: white with dark patches that spin
        ctx.save(); ctx.translate(ball.x, ball.y); ctx.rotate(ball.rot);
        ctx.shadowColor = 'rgba(255,255,255,.5)'; ctx.shadowBlur = 8;
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, BR, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
        ctx.fillStyle = '#26203d';
        ctx.beginPath(); for (let k = 0; k < 5; k++) { const a = k / 5 * Math.PI * 2 - Math.PI / 2; ctx.lineTo(Math.cos(a) * 8, Math.sin(a) * 8); } ctx.closePath(); ctx.fill();
        for (let k = 0; k < 5; k++) { const a = k / 5 * Math.PI * 2 - Math.PI / 2; ctx.beginPath(); ctx.arc(Math.cos(a) * 18, Math.sin(a) * 18, 4.5, 0, Math.PI * 2); ctx.fill(); }
        ctx.restore();
        particles.draw(ctx);
        // scoreboard + clock
        label(ctx, `${goals[0]}  :  ${goals[1]}`, W / 2, 40, 54, 'rgba(255,255,255,.9)');
        label(ctx, golden ? 'GOLDEN GOAL' : `0:${String(Math.ceil(clock)).padStart(2, '0')}`, W / 2, 84, 22, golden ? '#ffd93d' : 'rgba(255,255,255,.7)');
        if (st === 'kickoff') label(ctx, stT > 0.35 ? 'Get ready' : 'GO!', W / 2, 200, 44, '#fff', 'center', 0.85);
        if (banner && st === 'goal') label(ctx, banner, W / 2, 200, 70, '#ffd93d');
        // controls strip
        ctx.fillStyle = '#150d2b'; ctx.fillRect(0, PITCH, W, H - PITCH);
        pad.draw(ctx);
        if (!api.isTouch()) {
          const t = solo() ? ['A D  or  ← →  run      W  or  ↑  jump      S  /  Space  kick']
            : ['Player 1:  A D run,  W jump,  S or Space kick', 'Player 2:  ← → run,  ↑ jump,  ↓ or Enter kick'];
          t.forEach((s, n) => label(ctx, s, W / 2, PITCH + (t.length === 1 ? 55 : 40 + n * 34), 20, n === 1 ? COL[1] : (solo() ? '#fff' : COL[0]), 'center', 0.85));
        }
      },
    };
    return game;
  },
});


/* ==========================================================================
   7. Home page + router
   ========================================================================== */
const homeEl = $('#home');
const gameViewEl = $('#gameView');
let arena = null;
let homeScroll = 0;
let lastRandomId = null;
let currentId;                 // id of the game on screen, null for the home page (undefined until the first route)

const GROUPS = [
  { id: 'balls', title: 'Bouncing ball games', note: 'Paddles, pegs and pile-ups.' },
  { id: 'quick', title: 'Quick games',         note: 'Thirty seconds to learn, a lifetime to master.' },
  { id: 'two',   title: 'Two players',         note: 'One screen, two people, bragging rights.' },
];

/** What the card shows under the description: your best score, or how many matches you've played. */
function cardStatus(g) {
  const best = Scores.get(g.id);
  const unit = (g.scoring && g.scoring.unit) || '';
  if (best > 0) return `<span>Best</span><b>${best}${unit}</b>`;
  if (g.players === 2) {
    const n = Plays.get(g.id);
    if (n > 0) return `<span>Played</span><b>${n}</b>`;
  }
  return '<span>Not played yet</span>';
}

/** Build the card grid, grouped by section. Called every time we return home so scores stay fresh. */
function renderGrid() {
  const grid = $('#grid');
  grid.innerHTML = '';
  for (const grp of GROUPS) {
    const list = GAMES.filter(g => g.group === grp.id);
    if (!list.length) continue;
    const head = document.createElement('li');
    head.className = 'group-head';
    head.innerHTML = `<h2>${grp.title}</h2><p>${grp.note}</p>`;
    grid.appendChild(head);
    for (const g of list) {
      const tag = g.players === 2 ? '2 players' : g.players === 'both' ? '1–2 players' : '';
      const li = document.createElement('li');
      li.innerHTML = `
        <a class="card" href="#/${g.id}" data-id="${g.id}" style="--c:${g.color}">
          <span class="card-emoji" aria-hidden="true">${g.emoji}</span>
          <span class="card-name">${g.name}</span>
          <span class="card-desc">${g.blurb}</span>
          <span class="card-foot">
            <span class="card-best">${cardStatus(g)}</span>
            ${tag ? `<span class="card-tag">${tag}</span>` : ''}
          </span>
        </a>`;
      grid.appendChild(li);
    }
  }
}

/** The title is made of letter tiles; tapping one boings it and plays a note. */
function buildWordmark() {
  const mark = $('#wordmark');
  const palette = ['--pink', '--orange', '--lemon', '--lime', '--cyan', '--violet', '--pink', '--orange', '--lemon', '--lime'];
  const tilt = [-4, 3, -2, 4, -3, 3, -4, 2, -3, 4];
  let n = 0;
  for (const w of ['bored', 'games']) {
    const word = document.createElement('span');
    word.className = 'word';
    word.setAttribute('aria-hidden', 'true');
    for (const ch of w) {
      const tile = document.createElement('span');
      tile.className = 'tile';
      tile.textContent = ch;
      tile.dataset.i = n;
      tile.style.setProperty('--c', `var(${palette[n]})`);
      tile.style.setProperty('--r', `${tilt[n]}deg`);
      word.appendChild(tile); n++;
    }
    mark.appendChild(word);
  }
  mark.addEventListener('pointerdown', e => {
    const tile = e.target.closest('.tile');
    if (!tile) return;
    tile.classList.remove('boing'); void tile.offsetWidth; tile.classList.add('boing');
    Sound.play('note', Number(tile.dataset.i));
  });
  mark.addEventListener('animationend', e => e.target.classList.remove('boing'));
}

function randomGame() {
  const pool = GAMES.filter(g => g.id !== lastRandomId);
  const g = pool.length ? pick(pool) : GAMES[0];
  lastRandomId = g.id;
  navigate(g.id);
}

function closeArena() {
  if (arena) { arena.destroy(); arena = null; }
}

function showHome() {
  closeArena();
  currentId = null;
  gameViewEl.hidden = true;
  homeEl.hidden = false;
  document.title = 'boredgames';
  renderGrid();
  window.scrollTo(0, homeScroll);
}

function showGame(def) {
  closeArena();
  currentId = def.id;
  if (!homeEl.hidden) homeScroll = window.scrollY;
  homeEl.hidden = true;
  gameViewEl.hidden = false;
  document.title = `${def.name} · boredgames`;
  window.scrollTo(0, 0);
  arena = createArena(def, gameViewEl, { onExit: () => navigate(null) });
}

/**
 * Open a game (or the home page when id is null).
 * The page is switched directly, so it works even where links and the address bar can't be relied on
 * (embedded previews, sandboxed frames). The #/game-id hash is kept in sync when possible, which is what
 * makes the browser's Back button and shareable links work.
 */
function navigate(id) {
  const def = GAMES.find(g => g.id === id);
  def ? showGame(def) : showHome();
  try { location.hash = def ? `#/${def.id}` : '#/'; } catch (e) { /* no address bar to update: fine */ }
}

/** #/brick-breaker → that game; anything else → home. Works from a plain file:// page too. */
function route() {
  const id = location.hash.replace(/^#\/?/, '');
  const def = GAMES.find(g => g.id === id);
  if ((def ? def.id : null) === currentId) return;          // navigate() already showed it
  def ? showGame(def) : showHome();
}

function boot() {
  buildWordmark();
  refreshMuteButtons();
  $('#randomBtn').addEventListener('click', () => { Sound.play('click'); randomGame(); });
  // Cards are real links (so "open in new tab" works) but a plain click opens the game directly.
  $('#grid').addEventListener('click', e => {
    const card = e.target.closest('a.card');
    if (!card || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    Sound.play('click');
    navigate(card.dataset.id);
  });
  window.addEventListener('hashchange', route);
  route();
}
boot();
</script>
</body>
</html>
